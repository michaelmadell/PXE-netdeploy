name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # tags, for the version (git describe)
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - uses: extractions/setup-just@v3
      # Linux hosts need these from the distribution (ADR 0030); the wimlib
      # test and the smoke test below use them.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y wimtools cabextract
      - run: pnpm --dir web install --frozen-lockfile
      - run: just check-drift
      - run: just lint
      - run: just test
      - run: just build
      - if: runner.os == 'Linux'
        run: bash scripts/linux-smoke.sh dist/netdeployd-linux-amd64
      # The .deb (ADR 0031): install, reconfigure, purge, reinstall as root
      # with systemd, on the throwaway runner.
      - if: runner.os == 'Linux'
        run: just package -SkipBuild
      - if: runner.os == 'Linux'
        run: bash scripts/deb-smoke.sh dist/netdeploy_*_amd64.deb
