openapi: 3.0.3
info:
  title: Deployment Framework API
  version: 0.1.0
  description: |
    Network OS deployment (PXE / UEFI HTTP Boot) with Secure Boot support.

    Draft v0 (OpenAPI 3.0.3 for generator compatibility). Two audiences:

    * **Admin API** (`bearerAuth`): used by the web UI and automation.
    * **Agent API**: used by the WinPE agent. `/agent/check-in` is unauthenticated,
      `/agent/unlock` exchanges the boot prompt password for a short session
      (`agentSessionAuth`), and everything during a deployment uses `agentAuth`.

    ## Boot model (ADR 0013)
    Every PXE client that passes the architecture and per-interface MAC filters
    boots WinPE. A machine is only re-imaged if a deployment was scheduled for it
    through this API ("armed"), or someone at the machine enters the boot prompt
    password. Otherwise the agent counts down and boots the local disk, so
    machines with network boot first never loop.

    ## Conventions
    * All IDs are opaque ULID strings.
    * Lists use cursor pagination: `?limit=&cursor=` → `{ items, nextCursor }`.
    * Errors use RFC 9457 `application/problem+json` with a stable `code`.
    * Long-running work (ISO import, driver import, boot image build) returns
      `202 Accepted` with a `Job`. Progress via `GET /jobs/{id}` or `GET /events` (SSE).
    * Create/command `POST`s accept an `Idempotency-Key` header; a replay with the
      same key returns the original response instead of doing the work twice.
      Responses are kept for 24 hours; reusing a key with a different body returns
      `422` (`code: idempotency_key_reused`). 5xx responses are not kept.
    * Mutations of existing resources require `If-Match` with the resource `etag`;
      a stale etag returns `412`.
    * Boot files and image content are served outside the API under `/content/...`
      (HTTP/HTTPS) and over TFTP. URLs to them appear in resources as `contentUrl`.
      Each deployment interface's content listener (`services.http`) serves only
      `/content/boot/{path}` (the requesting client's boot content, chosen as for
      TFTP; `GET`/`HEAD` with `Range`) and the agent API (`/api/v1/agent/...`).
      The admin API is never reachable there (ADR 0009).
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: system
    description: System-level operations and health checks.
  - name: uploads
    description: Resumable file uploads using the tus protocol.
  - name: images
    description: Imported OS media (ISOs), the source for boot and install images.
  - name: drivers
    description: Driver packages and the groups that combine them.
  - name: boot-images
    description: Custom boot images built from available builders.
  - name: unattend
    description: Templates that render autounattend.xml for a deployment.
  - name: profiles
    description: Deployment profiles defining client configurations.
  - name: clients
    description: Managed client machines.
  - name: deployments
    description: Deployment records and status.
  - name: jobs
    description: Long-running background jobs.
  - name: smb-targets
    description: SMB shares used by the `smb` install method.
  - name: secrets
    description: Encrypted, write-only values (passwords, join credentials, ODJ blobs, Autopilot files).
  - name: settings
    description: Global settings for the deployment framework.
  - name: dhcp
    description: Leases handed out by the built-in DHCP server (configuration lives in settings).
  - name: tokens
    description: Admin API tokens.
  - name: agent
    description: Called by the WinPE agent only. Never exposed to admin tokens.

paths:
  # ---------------------------------------------------------------- system
  /system/health:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      summary: Liveness and per-service health (database, content store, DHCP, TFTP, HTTP).
      responses:
        "200":
          description: Healthy or degraded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Unhealthy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /system/capabilities:
    get:
      tags: [system]
      operationId: getCapabilities
      summary: What this host can do (builders available, host OS, SMB support).
      description: |
        The UI uses this to show which boot image builders are available.
        On Windows hosts with the ADK/DISM present, `dism` is available; `wimlib`
        is available wherever wimlib is installed (bundled on Linux builds).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "401": { $ref: "#/components/responses/Problem" }

  /system/backups:
    get:
      tags: [system]
      operationId: listBackups
      summary: List the backups at the configured destination, newest first.
      description: |
        Reads `snapshots/` at `backup.destination` (ADR 0020). `409`
        (`code: backup_not_configured`) without a destination; `502`
        (`code: backup_destination_error`) when it can't be reached or read,
        with the reason in `detail`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Backup" } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
    post:
      tags: [system]
      operationId: runBackup
      summary: Back up now.
      description: |
        Queues a `system.backup` job, whatever `backup.schedule` says. If a
        backup is already queued or running, returns that job. `409`
        (`code: backup_not_configured`) without `backup.destination`. Also the
        way to test a destination: a failure shows in the job's `error`.
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /events:
    get:
      tags: [system]
      operationId: streamEvents
      summary: Server-sent events for job progress and deployment status.
      description: |
        A server-sent event stream: each message has `event: <Event.type>` and
        `data: <Event as JSON>`, and a comment line is sent every 15 s to keep the
        connection open. Events are notifications to re-fetch something, not a
        log: nothing is stored, `Last-Event-ID` is not supported, and a client
        that falls more than 64 events behind is disconnected. After any
        reconnect, re-read the resources you show.
      responses:
        "200":
          description: SSE stream. Each event's `data` is an `Event` JSON object.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- uploads (tus)
  /uploads:
    options:
      tags: [uploads]
      operationId: getUploadCapabilities
      summary: tus discovery (versions, extensions, maximum size).
      responses:
        "204":
          description: Supported tus features.
          headers:
            Tus-Resumable: { schema: { type: string, enum: ["1.0.0"] } }
            Tus-Version: { schema: { type: string, example: "1.0.0" } }
            Tus-Extension: { schema: { type: string, example: "creation,termination,expiration" } }
            Tus-Max-Size: { schema: { type: integer, format: int64, example: 68719476736 }, description: "64 GiB." }
        "401": { $ref: "#/components/responses/Problem" }
    get:
      tags: [uploads]
      operationId: listUploads
      summary: List uploads (JSON, not part of tus).
      description: Newest last. Includes incomplete uploads and imported ones kept until deleted.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Create a resumable upload (tus 1.0.0 creation extension).
      description: |
        Resumable uploads follow the tus 1.0.0 protocol (core plus the creation,
        termination and expiration extensions), not plain JSON (ADR 0017). Use a
        tus client library (e.g. tus-js-client). Once complete, pass the
        `uploadId` (the last path segment of `Location`) to an import endpoint
        (`POST /images`, `POST /driver-packages`).

        * Every response carries `Tus-Resumable: 1.0.0`; requests without it get
          `412`.
        * `Upload-Metadata` may carry `filename` and `filetype` (tus format:
          comma-separated `key base64value` pairs).
        * `Upload-Defer-Length` is not supported (`400`, `code: defer_length_unsupported`).
        * At most 64 GiB (`413`, `code: upload_too_large`).
        * `507` (`code: insufficient_storage`) if `Upload-Length`, plus the bytes
          still to come for other incomplete uploads, plus `storage.reserveBytes`
          doesn't fit in the content store's free space.
        * Uploads that were never imported expire `storage.uploadExpiryHours` after
          their last activity (`Upload-Expires`). An upload whose import succeeded
          is kept until deleted.
      parameters:
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
        - { name: Upload-Length, in: header, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: Upload-Metadata, in: header, required: false, schema: { type: string } }
      responses:
        "201":
          description: Created. `Location` header holds the upload URL.
          headers:
            Location: { schema: { type: string } }
            Tus-Resumable: { schema: { type: string } }
            Upload-Expires: { schema: { type: string }, description: RFC 9110 HTTP date. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "507": { $ref: "#/components/responses/Problem" }

  /uploads/{uploadId}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    head:
      tags: [uploads]
      operationId: getUploadOffset
      summary: Current offset (for resuming).
      responses:
        "200":
          description: "OK (no body; `Cache-Control: no-store`)."
          headers:
            Tus-Resumable: { schema: { type: string } }
            Upload-Offset: { schema: { type: integer, format: int64 } }
            Upload-Length: { schema: { type: integer, format: int64 } }
            Upload-Expires: { schema: { type: string }, description: Absent when the upload is kept until deleted. }
            Cache-Control: { schema: { type: string } }
        "401": { description: Unauthorized (no body). }
        "404": { description: "No such upload, or it expired (no body)." }
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Get an upload (JSON, not part of tus).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [uploads]
      operationId: appendUpload
      summary: Append bytes.
      description: |
        `Upload-Offset` must equal the server's offset (`409`, `code:
        upload_offset_mismatch`). Bytes received are kept even if the connection
        drops; `HEAD` tells the client where to resume. A new `PATCH` for an
        upload still being written stops the earlier request first. If free
        space runs short the bytes so far are kept and the request ends with
        `507`.
      parameters:
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
        - { name: Upload-Offset, in: header, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: Bytes accepted.
          headers:
            Tus-Resumable: { schema: { type: string } }
            Upload-Offset: { schema: { type: integer, format: int64 } }
            Upload-Expires: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "507": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [uploads]
      operationId: deleteUpload
      summary: Delete an upload (tus termination extension).
      description: |
        Works at any stage, including imported uploads kept until deleted. `409`
        (`code: upload_in_use`) while an import job using it is queued or running.
        Files already imported from it are not affected.
      parameters:
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- images
  /images:
    get:
      tags: [images]
      operationId: listImages
      summary: List imported images.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/ImageKind" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [images]
      operationId: importImage
      summary: Import an ISO from a completed upload.
      description: |
        Extracts the ISO, detects its kind, and fills in `details`. For Windows media
        this means enumerating editions, recording the install image format
        (wim/esd/swm), and extracting every boot manager found (including any
        2023-signed `EFI_EX` variant inside the WIMs) with its signer (ADR 0018).
        The image keeps the ISO's file name, volume label and SHA-256; it doesn't
        need the upload afterwards, so the upload can be deleted.

        Media must be UDF (all Windows ISOs are); plain ISO9660 media fails the
        job with `unsupported_media` until the Linux phase. Unreadable media fails
        with `invalid_media`.

        Deduplication: if an image with the same SHA-256 already exists, the import
        job finishes immediately with `resourceId` set to the existing image and no
        second copy is stored. (The hash is only known once the upload is read, so
        this is reported through the job rather than as an immediate `200`.)

        Disk space: `507` (`code: insufficient_storage`) if the extracted size
        (estimated as the upload's size) plus `storage.reserveBytes` doesn't fit.
        A job that runs short of space while writing fails with the same code.

        The upload must be complete (`409`, `code: upload_incomplete`) and not in
        use by another queued or running import (`409`, `code: upload_in_use`);
        an unknown upload is `404`. After a successful import the upload is kept
        until deleted; after a failed one it is kept for a retry until
        `storage.uploadExpiryHours` later, and the job's error says when.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageImport" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "507": { $ref: "#/components/responses/Problem" }

  /images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/ImageId"
    get:
      tags: [images]
      operationId: getImage
      summary: Get details of a specific image.
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [images]
      operationId: updateImage
      summary: Update details of a specific image.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [images]
      operationId: deleteImage
      summary: Delete a specific image.
      description: "Fails with `409` (`code: image_in_use`) if referenced by a boot image or profile."
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- drivers
  /driver-packages:
    get:
      tags: [drivers]
      operationId: listDriverPackages
      summary: List available driver packages.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: class, in: query, schema: { type: string }, description: "INF class, e.g. Net, SCSIAdapter." }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/DriverRole" } }
        - { name: hardwareId, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverPackagePage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [drivers]
      operationId: importDriverPackage
      summary: Import a driver archive from a completed upload.
      description: |
        Accepted formats: zip, cab, 7z (ADR 0019). Vendor `.exe` and `.msi` installers
        are rejected with `400` (`code: unsupported_archive`); extract them first
        (most vendors document an extract-only switch). LZX-compressed CABs need
        `expand.exe` (Windows) or `cabextract` (Linux) on the host
        (`/system/capabilities` `cabLzx`); without one the job fails with
        `unsupported_archive`. Archives that expand to more than 32 times their size
        or 200,000 files fail with `invalid_archive`; archives without an INF fail
        with `no_drivers`.

        Every INF is parsed for class, role, provider, version, architectures,
        targeted OS versions and hardware IDs, and its catalog signature is checked,
        including that the INF and the files it installs are covered by the catalog.
        Identical packages (same SHA-256) are deduplicated as for images, and
        disk space and the upload are checked as for images (`507`
        `insufficient_storage`; `404`; `409` `upload_incomplete` / `upload_in_use`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId, name]
              properties:
                uploadId: { type: string }
                name: { type: string }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "507": { $ref: "#/components/responses/Problem" }

  /driver-packages/{driverPackageId}:
    parameters:
      - { name: driverPackageId, in: path, required: true, schema: { type: string } }
    get:
      tags: [drivers]
      operationId: getDriverPackage
      summary: Get details of a specific driver package.
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPackage" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [drivers]
      operationId: updateDriverPackage
      summary: Rename the package or enable/disable individual INFs.
      description: |
        Disabled INFs are skipped when the package is injected. Changing which INFs
        are enabled marks dependent boot images `stale`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverPackageUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPackage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [drivers]
      operationId: deleteDriverPackage
      summary: Delete a specific driver package.
      description: "Fails with `409` (`code: package_in_use`) while a driver group includes it."
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /driver-groups:
    get:
      tags: [drivers]
      operationId: listDriverGroups
      summary: List available driver groups.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverGroupPage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [drivers]
      operationId: createDriverGroup
      summary: Create a new driver group.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverGroupInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /driver-groups/{driverGroupId}:
    parameters:
      - { name: driverGroupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [drivers]
      operationId: getDriverGroup
      summary: Get details of a specific driver group.
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverGroup" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [drivers]
      operationId: replaceDriverGroup
      summary: Replace a specific driver group.
      description: |
        Changing membership marks dependent boot images `stale`. Unknown driver
        package ids give `422` (`code: unknown_driver_package`), as on create.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverGroupInput" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [drivers]
      operationId: deleteDriverGroup
      summary: Delete a specific driver group.
      description: "Fails with `409` (`code: driver_group_in_use`) if a boot image uses it."
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- boot images
  /boot-images:
    get:
      tags: [boot-images]
      operationId: listBootImages
      summary: List available boot images.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootImagePage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [boot-images]
      operationId: createBootImage
      summary: Define a boot image (does not build it).
      description: |
        Checks the inputs that don't depend on the host or on driver contents:
        the source image (a ready `windows` image of the same architecture),
        `sourceIndex`, the driver groups, `agentVersion` and `bootmgr`.
        `optionalComponents` and `produceHttpBootIso: true` are refused with
        `422` (`code: not_implemented`) for now (ADR 0022).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootImageInput" }
      responses:
        "201":
          description: Created in `draft` state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootImage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /boot-images/{bootImageId}:
    parameters:
      - $ref: "#/components/parameters/BootImageId"
    get:
      tags: [boot-images]
      operationId: getBootImage
      summary: Get details of a specific boot image.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootImage" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [boot-images]
      operationId: replaceBootImage
      summary: Replace a specific boot image.
      description: |
        Same checks as create. Changing inputs marks the image `stale` until
        rebuilt; it keeps serving its last build meanwhile.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootImageInput" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootImage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [boot-images]
      operationId: deleteBootImage
      summary: Delete a specific boot image.
      description: "Fails with `409` (`code: build_in_progress`) while a build is queued or running; cancel its job first."
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /boot-images/{bootImageId}/build:
    parameters:
      - $ref: "#/components/parameters/BootImageId"
    post:
      tags: [boot-images]
      operationId: buildBootImage
      summary: Build (or rebuild) the boot image.
      description: |
        Resolves the inputs (ADR 0022) and computes `inputHash`. Unless `force`,
        if this boot image's current build, or another boot image's build, has the
        same `inputHash`, returns `200` and serves that build without a job.
        Otherwise queues a `bootImage.build` job (`202`). Builds run one at a time
        per host. Only one build per boot image is queued or running at a time; a
        second request returns `409` (`code: build_in_progress`).

        `422` codes: `builder_unavailable` (no usable builder: DISM needs an
        elevated server, wimlib needs `wimlib-imagex`), `unsigned_driver` (an
        enabled INF in the selected groups is unsigned),
        `driver_architecture` (an enabled INF doesn't support the architecture),
        `source_image_unavailable`, `agent_unavailable` (no bundled agent for the
        architecture). `507` (`code: insufficient_storage`): about four times the
        source boot.wim must fit above the storage reserve.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, default: false, description: Rebuild even if inputs are unchanged. }
      responses:
        "200":
          description: Already up to date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootImage" }
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "507": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- unattend
  /unattend-templates:
