        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /unattend-templates/{templateId}/render:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string } }
    post:
      tags: [unattend]
      operationId: renderUnattendTemplate
      summary: Preview a rendered unattend file.
      description: |
        Renders with the same data an agent would get, except every secret value is
        replaced by `********`. Pass `profileId` (and optionally `clientId`) to
        preview a real combination; `variables` are applied last, for experiments.
        `installMethod` selects which passes are rendered: `agent` strips the
        `windowsPE` pass, `smb` renders the full autounattend.xml.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profileId: { type: string, nullable: true }
                clientId: { type: string, nullable: true }
                installMethod: { $ref: "#/components/schemas/InstallMethod" }
                variables: { $ref: "#/components/schemas/Variables" }
      responses:
        "200":
          description: Rendered XML.
          content:
            application/xml:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

