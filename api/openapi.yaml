openapi: 3.0.3
info:
  title: Deployment Framework API
  version: 0.1.0
  description: |
    Network OS deployment (PXE / UEFI HTTP Boot) with Secure Boot support.

    Draft v0 (OpenAPI 3.0.3 for generator compatibility). Two audiences:

    * **Admin API**: the web UI signs in with a username and password and gets a
      session cookie (`cookieAuth`); automation sends an API token
      (`bearerAuth`). Either works on every admin operation, except that API
      tokens can't manage accounts or tokens (`403 not_for_api_tokens`).
    * **Agent API**: used by the WinPE agent. `/agent/check-in` is unauthenticated,
      `/agent/unlock` exchanges the boot prompt password for a short session
      (`agentSessionAuth`), and everything during a deployment uses `agentAuth`.

    ## Boot model (ADR 0013)
    Every PXE client that passes the architecture and per-interface MAC filters
    boots WinPE. A machine is only re-imaged if a deployment was scheduled for it
    through this API ("armed"), or someone at the machine enters the boot prompt
    password. Otherwise the agent counts down and boots the local disk, so
    machines with network boot first never loop.

    ## Authentication (ADR 0029)
    Named local accounts, all with full admin rights. `POST /auth/sign-in` sets
    the `__Host-netdeploy-session` cookie (`HttpOnly`, `Secure`,
    `SameSite=Strict`); a session ends after 8 hours idle and 7 days after
    sign-in. Cookie requests that change something (`POST`, `PUT`, `PATCH`,
    `DELETE`) must carry an `Origin` matching the admin listener, or get `403`
    (`code: bad_origin`). API tokens (`Authorization: Bearer ndt_…`) are created
    by a signed-in account, shown once, stored hashed, and revoked with the
    account that created them. Without either, admin operations return `401`
    (`code: unauthenticated`); `GET /auth/session` says whether the first
    account still has to be created (`setupRequired`). Sign-in and setup
    failures are rate-limited per username and per source IP (`429`,
    `Retry-After`).

    The first account is created with `POST /auth/setup` and a one-time setup
    code the server writes to its log and to `<data>/setup-code.txt` while no
    account exists. A locked-out server is recovered offline with
    `netdeployd admin reset-password -user <name>` (server stopped).

    ## Conventions
    * All IDs are opaque ULID strings.
    * Lists use cursor pagination: `?limit=&cursor=` → `{ items, nextCursor }`.
    * Errors use RFC 9457 `application/problem+json` with a stable `code`.
    * Long-running work (ISO import, driver import, boot image build) returns
      `202 Accepted` with a `Job`. Progress via `GET /jobs/{id}` or `GET /events` (SSE).
    * Create/command `POST`s accept an `Idempotency-Key` header; a replay with the
      same key returns the original response instead of doing the work twice.
      Responses are kept for 24 hours; reusing a key with a different body returns
      `422` (`code: idempotency_key_reused`). 5xx responses are not kept.
    * Mutations of existing resources require `If-Match` with the resource `etag`;
      a stale etag returns `412`.
    * Boot files and image content are served outside the API under `/content/...`
      (HTTP/HTTPS) and over TFTP. URLs to them appear in resources as `contentUrl`.
      Each deployment interface's content listeners (`services.http`, and
      `services.https` with a certificate from the internal content CA, ADR 0028)
      serve only `/content/boot/{path}` (the requesting client's boot content,
      chosen as for TFTP; `GET`/`HEAD` with `Range`) and the agent API
      (`/api/v1/agent/...`). The admin API is never reachable there (ADR 0009).
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /api/v1

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: system
    description: System-level operations and health checks.
  - name: uploads
    description: Resumable file uploads using the tus protocol.
  - name: images
    description: Imported OS media (ISOs), the source for boot and install images.
  - name: drivers
    description: Driver packages and the groups that combine them.
  - name: boot-images
    description: Custom boot images built from available builders.
  - name: unattend
    description: Templates that render autounattend.xml for a deployment.
  - name: profiles
    description: Deployment profiles defining client configurations.
  - name: clients
    description: Managed client machines.
  - name: deployments
    description: Deployment records and status.
  - name: jobs
    description: Long-running background jobs.
  - name: smb-targets
    description: SMB shares used by the `smb` install method.
  - name: secrets
    description: Encrypted, write-only values (passwords, join credentials, ODJ blobs, Autopilot files).
  - name: settings
    description: Global settings for the deployment framework.
  - name: dhcp
    description: Leases handed out by the built-in DHCP server (configuration lives in settings).
  - name: auth
    description: Signing in, the session, and setting up the first account.
  - name: users
    description: Local admin accounts. Not available to API tokens.
  - name: tokens
    description: Admin API tokens. Not available to API tokens.
  - name: agent
    description: Called by the WinPE agent only. Never exposed to admin tokens.

paths:
  # ---------------------------------------------------------------- system
  /system/health:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      summary: Liveness and per-service health (database, content store, DHCP, TFTP, HTTP).
      description: |
        Open, for monitoring. Without a session or token only `status` and each
        service's `status` are returned: no `detail`, bind failures, storage,
        backup or warnings, which describe the configuration (ADR 0029).
      responses:
        "200":
          description: Healthy or degraded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Unhealthy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /system/capabilities:
    get:
      tags: [system]
      operationId: getCapabilities
      summary: What this host can do (builders available, host OS, SMB support).
      description: |
        The UI uses this to show which boot image builders are available.
        On Windows hosts with the ADK/DISM present, `dism` is available; `wimlib`
        is available wherever wimlib is installed (bundled on Linux builds).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "401": { $ref: "#/components/responses/Problem" }

  /system/interfaces:
    get:
      tags: [system]
      operationId: listHostInterfaces
      summary: Network interfaces of the machine the server runs on.
      description: |
        For choosing deployment interfaces: an entry's `name` is the value
        `InterfaceSettings.name` takes. Read from the operating system on every
        call, in its order, including interfaces that are disconnected or have no
        IPv4 address (a deployment interface needs one to be saved).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/HostInterface" } }
        "401": { $ref: "#/components/responses/Problem" }

  /system/backups:
    get:
      tags: [system]
      operationId: listBackups
      summary: List the backups at the configured destination, newest first.
      description: |
        Reads `snapshots/` at `backup.destination` (ADR 0020). `409`
        (`code: backup_not_configured`) without a destination; `502`
        (`code: backup_destination_error`) when it can't be reached or read,
        with the reason in `detail`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Backup" } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
    post:
      tags: [system]
      operationId: runBackup
      summary: Back up now.
      description: |
        Queues a `system.backup` job, whatever `backup.schedule` says. If a
        backup is already queued or running, returns that job. `409`
        (`code: backup_not_configured`) without `backup.destination`. Also the
        way to test a destination: a failure shows in the job's `error`.
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /events:
    get:
      tags: [system]
      operationId: streamEvents
      summary: Server-sent events for job progress and deployment status.
      description: |
        A server-sent event stream: each message has `event: <Event.type>` and
        `data: <Event as JSON>`, and a comment line is sent every 15 s to keep the
        connection open. Events are notifications to re-fetch something, not a
        log: nothing is stored, `Last-Event-ID` is not supported, and a client
        that falls more than 64 events behind is disconnected. After any
        reconnect, re-read the resources you show.
        Browsers authenticate it with the session cookie (`EventSource` can't
        send headers).
      responses:
        "200":
          description: SSE stream. Each event's `data` is an `Event` JSON object.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- uploads (tus)
  /uploads:
    options:
      tags: [uploads]
      operationId: getUploadCapabilities
      summary: tus discovery (versions, extensions, maximum size).
      responses:
        "204":
          description: Supported tus features.
          headers:
            Tus-Resumable: { schema: { type: string, enum: ["1.0.0"] } }
            Tus-Version: { schema: { type: string, example: "1.0.0" } }
            Tus-Extension: { schema: { type: string, example: "creation,termination,expiration" } }
            Tus-Max-Size: { schema: { type: integer, format: int64, example: 68719476736 }, description: "64 GiB." }
        "401": { $ref: "#/components/responses/Problem" }
    get:
      tags: [uploads]
      operationId: listUploads
      summary: List uploads (JSON, not part of tus).
      description: Newest last. Includes incomplete uploads and imported ones kept until deleted.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Create a resumable upload (tus 1.0.0 creation extension).
      description: |
        Resumable uploads follow the tus 1.0.0 protocol (core plus the creation,
        termination and expiration extensions), not plain JSON (ADR 0017). Use a
        tus client library (e.g. tus-js-client). Once complete, pass the
        `uploadId` (the last path segment of `Location`) to an import endpoint
        (`POST /images`, `POST /driver-packages`).

        * Every response carries `Tus-Resumable: 1.0.0`; requests without it get
          `412`.
        * `Upload-Metadata` may carry `filename` and `filetype` (tus format:
          comma-separated `key base64value` pairs).
        * `Upload-Defer-Length` is not supported (`400`, `code: defer_length_unsupported`).
        * At most 64 GiB (`413`, `code: upload_too_large`).
        * `507` (`code: insufficient_storage`) if `Upload-Length`, plus the bytes
          still to come for other incomplete uploads, plus `storage.reserveBytes`
          doesn't fit in the content store's free space.
        * Uploads that were never imported expire `storage.uploadExpiryHours` after
          their last activity (`Upload-Expires`). An upload whose import succeeded
          is kept until deleted.
      parameters:
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
        - { name: Upload-Length, in: header, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: Upload-Metadata, in: header, required: false, schema: { type: string } }
      responses:
        "201":
          description: Created. `Location` header holds the upload URL.
          headers:
            Location: { schema: { type: string } }
            Tus-Resumable: { schema: { type: string } }
            Upload-Expires: { schema: { type: string }, description: RFC 9110 HTTP date. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "507": { $ref: "#/components/responses/Problem" }

  /uploads/{uploadId}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    head:
      tags: [uploads]
      operationId: getUploadOffset
      summary: Current offset (for resuming).
      responses:
        "200":
          description: "OK (no body; `Cache-Control: no-store`)."
          headers:
            Tus-Resumable: { schema: { type: string } }
            Upload-Offset: { schema: { type: integer, format: int64 } }
            Upload-Length: { schema: { type: integer, format: int64 } }
            Upload-Expires: { schema: { type: string }, description: Absent when the upload is kept until deleted. }
            Cache-Control: { schema: { type: string } }
        "401": { description: Unauthorized (no body). }
        "404": { description: "No such upload, or it expired (no body)." }
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Get an upload (JSON, not part of tus).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [uploads]
      operationId: appendUpload
      summary: Append bytes.
      description: |
        `Upload-Offset` must equal the server's offset (`409`, `code:
        upload_offset_mismatch`). Bytes received are kept even if the connection
        drops; `HEAD` tells the client where to resume. A new `PATCH` for an
        upload still being written stops the earlier request first. If free
        space runs short the bytes so far are kept and the request ends with
        `507`.
      parameters:
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
        - { name: Upload-Offset, in: header, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: Bytes accepted.
          headers:
            Tus-Resumable: { schema: { type: string } }
            Upload-Offset: { schema: { type: integer, format: int64 } }
            Upload-Expires: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "507": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [uploads]
      operationId: deleteUpload
      summary: Delete an upload (tus termination extension).
      description: |
        Works at any stage, including imported uploads kept until deleted. `409`
        (`code: upload_in_use`) while an import job using it is queued or running.
        Files already imported from it are not affected.
      parameters:
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- images
  /images:
    get:
      tags: [images]
      operationId: listImages
      summary: List imported images.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/ImageKind" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [images]
      operationId: importImage
      summary: Import an ISO from a completed upload.
      description: |
        Extracts the ISO, detects its kind, and fills in `details`. For Windows media
        this means enumerating editions, recording the install image format
        (wim/esd/swm), and extracting every boot manager found (including any
        2023-signed `EFI_EX` variant inside the WIMs) with its signer (ADR 0018).
        The image keeps the ISO's file name, volume label and SHA-256; it doesn't
        need the upload afterwards, so the upload can be deleted.

        Linux media (ADR 0033) is recognised by family: `ubuntu` (casper:
        `casper/vmlinuz`, `casper/initrd`, `.disk/info`), `debian`
        (debian-installer in `install.amd/`, `install.a64/`, or `install/` on
        live media, with `.disk/info`) and `redhat` (`.treeinfo`, or
        `.discinfo` with `images/pxeboot/` on boot ISOs: Fedora, RHEL and its
        rebuilds). `details` records the
        distribution, version, architecture, and the shim, kernel and initrd
        with every signer. Only `ubuntu` is deployable for now
        (`details.deployable`); the others are recorded and refused by
        profile validation. Media that matches none is `kind: other`.

        Media is read as UDF if it has a UDF file system (all Windows ISOs),
        else as ISO9660 with Rock Ridge or Joliet names (Linux ISOs). Media with
        neither fails the job with `unsupported_media`; unreadable media fails
        with `invalid_media`.

        Deduplication: if an image with the same SHA-256 already exists, the import
        job finishes immediately with `resourceId` set to the existing image and no
        second copy is stored. (The hash is only known once the upload is read, so
        this is reported through the job rather than as an immediate `200`.)

        Disk space: `507` (`code: insufficient_storage`) if the extracted size
        (estimated as the upload's size) plus `storage.reserveBytes` doesn't fit.
        A job that runs short of space while writing fails with the same code.

        The upload must be complete (`409`, `code: upload_incomplete`) and not in
        use by another queued or running import (`409`, `code: upload_in_use`);
        an unknown upload is `404`. After a successful import the upload is kept
        until deleted; after a failed one it is kept for a retry until
        `storage.uploadExpiryHours` later, and the job's error says when.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageImport" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "507": { $ref: "#/components/responses/Problem" }

  /images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/ImageId"
    get:
      tags: [images]
      operationId: getImage
      summary: Get details of a specific image.
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [images]
      operationId: updateImage
      summary: Update details of a specific image.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [images]
      operationId: deleteImage
      summary: Delete a specific image.
      description: "Fails with `409` (`code: image_in_use`) if referenced by a boot image or profile."
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- drivers
  /driver-packages:
    get:
      tags: [drivers]
      operationId: listDriverPackages
      summary: List available driver packages.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: class, in: query, schema: { type: string }, description: "INF class, e.g. Net, SCSIAdapter." }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/DriverRole" } }
        - { name: hardwareId, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverPackagePage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [drivers]
      operationId: importDriverPackage
      summary: Import a driver archive from a completed upload.
      description: |
        Accepted formats: zip, cab, 7z (ADR 0019). Vendor `.exe` and `.msi` installers
        are rejected with `400` (`code: unsupported_archive`); extract them first
        (most vendors document an extract-only switch). LZX-compressed CABs need
        `expand.exe` (Windows) or `cabextract` (Linux) on the host
        (`/system/capabilities` `cabLzx`); without one the job fails with
        `unsupported_archive`. Archives that expand to more than 32 times their size
        or 200,000 files fail with `invalid_archive`; archives without an INF fail
        with `no_drivers`.

        Every INF is parsed for class, role, provider, version, architectures,
        targeted OS versions and hardware IDs, and its catalog signature is checked,
        including that the INF and the files it installs are covered by the catalog.
        Identical packages (same SHA-256) are deduplicated as for images, and
        disk space and the upload are checked as for images (`507`
        `insufficient_storage`; `404`; `409` `upload_incomplete` / `upload_in_use`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId, name]
              properties:
                uploadId: { type: string }
                name: { type: string }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "507": { $ref: "#/components/responses/Problem" }

  /driver-packages/{driverPackageId}:
    parameters:
      - { name: driverPackageId, in: path, required: true, schema: { type: string } }
    get:
      tags: [drivers]
      operationId: getDriverPackage
      summary: Get details of a specific driver package.
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPackage" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [drivers]
      operationId: updateDriverPackage
      summary: Rename the package or enable/disable individual INFs.
      description: |
        Disabled INFs are skipped when the package is injected. Changing which INFs
        are enabled marks dependent boot images `stale`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverPackageUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPackage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [drivers]
      operationId: deleteDriverPackage
      summary: Delete a specific driver package.
      description: "Fails with `409` (`code: package_in_use`) while a driver group includes it."
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /driver-groups:
    get:
      tags: [drivers]
      operationId: listDriverGroups
      summary: List available driver groups.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverGroupPage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [drivers]
      operationId: createDriverGroup
      summary: Create a new driver group.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverGroupInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /driver-groups/{driverGroupId}:
    parameters:
      - { name: driverGroupId, in: path, required: true, schema: { type: string } }
    get:
      tags: [drivers]
      operationId: getDriverGroup
      summary: Get details of a specific driver group.
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverGroup" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [drivers]
      operationId: replaceDriverGroup
      summary: Replace a specific driver group.
      description: |
        Changing membership marks dependent boot images `stale`. Unknown driver
        package ids give `422` (`code: unknown_driver_package`), as on create.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverGroupInput" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [drivers]
      operationId: deleteDriverGroup
      summary: Delete a specific driver group.
      description: "Fails with `409` (`code: driver_group_in_use`) if a boot image or a profile (OS drivers) uses it."
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- boot images
  /boot-images:
    get:
      tags: [boot-images]
      operationId: listBootImages
      summary: List available boot images.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootImagePage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [boot-images]
      operationId: createBootImage
      summary: Define a boot image (does not build it).
      description: |
        Checks the inputs that don't depend on the host or on driver contents:
        the source image (a ready `windows` image of the same architecture),
        `sourceIndex`, the driver groups, `agentVersion` and `bootmgr`.
        `optionalComponents` and `produceHttpBootIso: true` are refused with
        `422` (`code: not_implemented`) for now (ADR 0022; HTTP Boot clients
        boot through iPXE instead, ADR 0032). `serverUrls` must all
        use one scheme: mixing `http://` and `https://` is refused with `422`
        (`code: mixed_server_urls`, ADR 0028).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootImageInput" }
      responses:
        "201":
          description: Created in `draft` state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootImage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /boot-images/{bootImageId}:
    parameters:
      - $ref: "#/components/parameters/BootImageId"
    get:
      tags: [boot-images]
      operationId: getBootImage
      summary: Get details of a specific boot image.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootImage" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [boot-images]
      operationId: replaceBootImage
      summary: Replace a specific boot image.
      description: |
        Same checks as create. Changing inputs marks the image `stale` until
        rebuilt; it keeps serving its last build meanwhile.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootImageInput" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootImage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [boot-images]
      operationId: deleteBootImage
      summary: Delete a specific boot image.
      description: |
        Fails with `409`: `build_in_progress` while a build is queued or running
        (cancel its job first); `boot_image_in_use` while a profile uses it.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /boot-images/{bootImageId}/build:
    parameters:
      - $ref: "#/components/parameters/BootImageId"
    post:
      tags: [boot-images]
      operationId: buildBootImage
      summary: Build (or rebuild) the boot image.
      description: |
        Resolves the inputs (ADR 0022) and computes `inputHash`. Unless `force`,
        if this boot image's current build, or another boot image's build, has the
        same `inputHash`, returns `200` and serves that build without a job.
        Otherwise queues a `bootImage.build` job (`202`). Builds run one at a time
        per host. Only one build per boot image is queued or running at a time; a
        second request returns `409` (`code: build_in_progress`).

        `422` codes: `builder_unavailable` (no usable builder: DISM needs an
        elevated server, wimlib needs `wimlib-imagex`), `unsigned_driver` (an
        enabled INF in the selected groups is unsigned),
        `driver_architecture` (an enabled INF doesn't support the architecture),
        `source_image_unavailable`, `agent_unavailable` (no bundled agent for the
        architecture). `507` (`code: insufficient_storage`): about four times the
        source boot.wim must fit above the storage reserve.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, default: false, description: Rebuild even if inputs are unchanged. }
      responses:
        "200":
          description: Already up to date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootImage" }
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "507": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- unattend
  /unattend-templates:
    get:
      tags: [unattend]
      operationId: listUnattendTemplates
      summary: List available unattend templates.
      description: |
        The built-in templates come first (`builtin` for Windows unattend files,
        `builtin-autoinstall` for Ubuntu autoinstall), then the stored ones.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnattendTemplatePage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [unattend]
      operationId: createUnattendTemplate
      summary: Create a new unattend template.
      description: |
        The template is parsed and rendered with sample data for each of its
        `identityModes` (`ad` with both join methods), or once for an
        `autoinstall` template, and the output checked (ADR 0027, 0035). `422` codes: `template_syntax` (doesn't parse; `detail` names the
        line), `template_render` (fails with the sample data, e.g. an undeclared
        variable or a field that doesn't exist), `template_invalid` (a check failed;
        `errors[]` has one entry per finding, `field` being the finding code),
        `identity_modes_required` (an `unattend` template with no
        `identityModes`), `not_for_format` (`identityModes` on an `autoinstall`
        template). Warnings don't refuse; `render` shows them.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnattendTemplateInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnattendTemplate" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /unattend-templates/{templateId}:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string } }
    get:
      tags: [unattend]
      operationId: getUnattendTemplate
      summary: Get details of a specific unattend template.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnattendTemplate" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [unattend]
      operationId: replaceUnattendTemplate
      summary: Replace a specific unattend template.
      description: |
        Same checks as create. `409` codes: `built_in` (the built-in templates are
        read-only; create a copy), `template_in_use` (the new `identityModes` drop a
        mode a profile using this template has). `422` `format_changed`: a
        template's `format` can't change. Pending and running deployments
        keep the copy they snapshotted.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnattendTemplateInput" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnattendTemplate" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [unattend]
      operationId: deleteUnattendTemplate
      summary: Delete a specific unattend template.
      description: "`409` codes: `built_in`, `template_in_use` (a profile uses it). Deployments keep their copy."
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /unattend-templates/render:
    post:
      tags: [unattend]
      operationId: renderUnattendDraft
      summary: Preview a template that isn't saved yet.
      description: |
        As `POST /unattend-templates/{templateId}/render`, for the template in the
        body (the editor's preview before saving). The save checks run too: a
        template that create would refuse with `template_invalid` renders here with
        error findings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnattendDraftRenderRequest" }
      responses:
        "200":
          description: Rendered, with findings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnattendRenderResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /unattend-templates/{templateId}/render:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string } }
    post:
      tags: [unattend]
      operationId: renderUnattendTemplate
      summary: Preview a rendered unattend file.
      description: |
        Renders with the data an agent would get, except that no secret is ever
        decrypted: every secret value is `********` (ADR 0027). With `profileId`
        (and optionally `clientId`) it renders that real combination and runs the
        checks arming runs; without, it renders sample data for `identityMode`
        (`unattend`) or the sample Linux profile (`autoinstall`). `variables` are
        applied last, for experiments. Agent-mode output has no `windowsPE` pass.

        `200` whenever the template renders, with `findings` (`ok` is false if any
        is an error). `422` codes: `template_syntax`, `template_render` (`detail`
        names the line), `identity_mode_unsupported` (the mode isn't in the
        template's `identityModes`). `404`: the template, profile or client.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnattendRenderRequest" }
      responses:
        "200":
          description: Rendered, with findings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnattendRenderResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- profiles
  /profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      summary: List available profiles.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [profiles]
      operationId: createProfile
      summary: Create a new profile.
      description: |
        Checks references (ADR 0024). `422` codes: `unknown_boot_image`,
        `install_image_unavailable` (not a ready `windows` image),
        `architecture_mismatch` (install image vs boot image), `unknown_edition`,
        `unknown_driver_group`, `unknown_unattend_template`,
        `template_identity_mismatch` (the profile's identity mode isn't in the
        template's `identityModes`), `not_implemented` (`installMethod: smb` until
        the agent's SMB install; identity `entra` until it is built). Secret and
        identity checks are in `validate`, which arming runs.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      tags: [profiles]
      operationId: getProfile
      summary: Get details of a specific profile.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [profiles]
      operationId: replaceProfile
      summary: Replace a specific profile.
      description: Same checks as create. Armed deployments keep their snapshot.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [profiles]
      operationId: deleteProfile
      summary: Delete a specific profile.
      description: "Fails with `409` (`code: profile_in_use`) while it is `bootPrompt.defaultProfileId` or a client's profile."
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /profiles/{profileId}/validate:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      tags: [profiles]
      operationId: validateProfile
      summary: Check a profile is deployable and report problems.
      description: |
        Example findings: boot image not built or stale; `smb` method without an
        `smbTargetId`; `unsigned` drivers in the boot image (error); drivers whose
        `targetOsVersions` exclude the WinPE or install build (warning); only a
        PCA 2011-signed boot manager available (clients that have revoked it will
        refuse to boot); host DISM older than the image build (warning);
        optional components requested without DISM or a matching ADK (error);
        identity mode missing a required secret, or a secret of the wrong kind
        (error); OS driver groups on a profile whose boot image cannot add them
        (`boot_image_cannot_add_drivers`, error; a warning while unknown);
        none of the boot image's `serverUrls` served by an interface with HTTP
        (or HTTPS, for `https://` URLs) on at that address and port
        (`agent_unreachable`, warning; a URL naming a host by DNS name counts when
        its port is served); `http://` server URLs served by an interface that
        also has HTTPS on (`agent_over_http`, warning: the boot prompt password
        and unattend secrets travel in clear, ADR 0028); template whose `identityModes` excludes the profile's mode (error);
        the unattend template's checks against the profile's data (ADR 0027:
        errors such as `unattend_missing_join`, `unattend_architecture`,
        `reserved_account_name`; warnings such as `unattend_ignores_computer_name`),
        and per assigned client a `requiredVariables` entry with no value (warning,
        `missing_variable`; an error when arming);
        computer-name pattern that can exceed 15 characters (warning, checked
        against each client's data at scheduling time); `ad`/`odj` profile assigned
        to clients without an ODJ blob (warning, listed per client); boot image
        `tftp` values above the `Settings.tftp` caps (warning,
        `tftp_capped_by_server`: the server will negotiate the caps instead).
        `POST /deployments` runs the same checks and refuses on any error. Implemented
        findings are listed in ADR 0026.
      responses:
        "200":
          description: Validation result (always 200; check `ok`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- clients
  /clients:
    get:
      tags: [clients]
      operationId: listClients
      summary: List available clients.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: mac, in: query, schema: { $ref: "#/components/schemas/MacAddress" } }
        - { name: profileId, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { $ref: "#/components/schemas/ClientSource" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [clients]
      operationId: createClient
      summary: Create a new client.
      description: |
        Creates a `manual` client. `409` (`code: mac_taken`) if the MAC is already
        registered, `409` (`code: reserved_ip_taken`) if another client has the
        `reservedIp`. `422` (`code: invalid_client`, one `errors[]` entry per field)
        for a malformed `mac` or `reservedIp`, or a non-null `profileId` (until
        profiles exist, Phase 4) or `secretRefs.odjBlob` (until secrets exist,
        Phase 5).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /clients/{clientId}:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      tags: [clients]
      operationId: getClient
      summary: Get details of a specific client.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [clients]
      operationId: replaceClient
      summary: Replace a specific client.
      description: |
        `If-Match` with the client's `etag`; `412` if it changed. Network boots
        update `lastSeenAt`, `lastIp` and `lastArch` without changing the etag.
        Same `409` and `422` cases as `POST /clients`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [clients]
      operationId: deleteClient
      summary: Delete a specific client.
      description: |
        Also deletes the client's deployment history. `409`
        (`code: deployment_active`) while it has a `pending` or `running`
        deployment; cancel that first.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- deployments
  /deployments:
    get:
      tags: [deployments]
      operationId: listDeployments
      summary: List deployments.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: clientId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DeploymentStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentPage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [deployments]
      operationId: scheduleDeployment
      summary: Arm a client for deployment on its next network boot.
      description: |
        An armed (`pending`) deployment runs on the client's next network boot without
        the boot prompt password: the agent shows a short countdown, and any key opens
        the profile menu instead. The deployment is consumed at agent check-in
        (`pending` → `running`), so later boots fall back to the prompt and then
        the local disk. This is how a known client is re-tested remotely.

        Snapshots the profile, the rendered computer name and copies of its secrets
        (ADR 0026) so later edits or rotations do not change an in-flight deployment.
        The client boots the boot image the snapshot names. `422` codes:
        `no_profile` (no `profileId` and the client has none), `profile_invalid`
        (`validateProfile` found errors; they are in `errors[]`),
        `invalid_computer_name`, `missing_odj_blob` (`ad`/`odj` profile, client
        without `secretRefs.odjBlob`). `409` (`code: deployment_active`) if the client
        already has a pending or running deployment. An armed deployment not picked up
        within `Settings.deployments.armedExpiryHours` fails (`expired`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string }
                profileId:
                  type: string
                  description: Overrides the client's assigned profile for this run.
      responses:
        "201":
          description: Scheduled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /deployments/{deploymentId}:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    get:
      tags: [deployments]
      operationId: getDeployment
      summary: Get details of a specific deployment.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /deployments/{deploymentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    post:
      tags: [deployments]
      operationId: cancelDeployment
      summary: Cancel a specific deployment.
      description: |
        Idempotent; cancelling a finished deployment returns it unchanged. A `pending`
        deployment is simply cancelled. A `running` one is marked `cancelled` at once
        and stopped gracefully (ADR 0026): the agent learns at its next request (within
        a minute), lets the command in progress finish (diskpart, DISM, bcdboot), stops
        before the next step, uploads its logs and reboots. The disk may be left
        partitioned or with an image but no boot files.
      responses:
        "200":
          description: Cancelled (or already finished).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /deployments/{deploymentId}/logs:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    get:
      tags: [deployments]
      operationId: getDeploymentLogs
      summary: Get logs of a specific deployment.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogEntryPage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- jobs
  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: List jobs.
      description: |
        Oldest first. Finished jobs are kept for 30 days (ADR 0016).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: status, in: query, schema: { $ref: "#/components/schemas/JobStatus" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/JobKind" } }
        - { name: resourceId, in: query, schema: { type: string }, description: "Jobs for one image, driver package or boot image." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /jobs/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get details of a specific job.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /jobs/{jobId}/cancel:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a specific job.
      description: |
        A queued job is cancelled at once. A running job gets `cancelRequested`
        and stops at its next checkpoint, then becomes `cancelled`. A finished job
        is returned unchanged.
      responses:
        "200":
          description: Cancellation requested (or job already finished).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- smb targets
  /smb-targets:
    get:
      tags: [smb-targets]
      operationId: listSmbTargets
      summary: List SMB targets.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SmbTarget" } }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [smb-targets]
      operationId: createSmbTarget
      summary: Create a new SMB target.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmbTargetInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmbTarget" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /smb-targets/{smbTargetId}:
    parameters:
      - { name: smbTargetId, in: path, required: true, schema: { type: string } }
    put:
      tags: [smb-targets]
      operationId: replaceSmbTarget
      summary: Replace a specific SMB target.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmbTargetInput" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmbTarget" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [smb-targets]
      operationId: deleteSmbTarget
      summary: Delete a specific SMB target.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /smb-targets/{smbTargetId}/test:
    parameters:
      - { name: smbTargetId, in: path, required: true, schema: { type: string } }
    post:
      tags: [smb-targets]
      operationId: testSmbTarget
      summary: Check the server can write to `localPath` and the share is reachable.
      responses:
        "200":
          description: Result (check `ok`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- secrets
  /secrets:
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: List secrets.
      description: Metadata only. Values are never returned by any admin endpoint.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/SecretKind" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretPage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [secrets]
      operationId: createSecret
      summary: Create a new secret.
      description: |
        For file-based kinds (`odj-blob`, `autopilot-json`, `provisioning-package`)
        pass `uploadId` instead of `value`. An `odj-blob` must be a `djoin /provision
        /savefile` file (base64 text, UTF-16 or UTF-8); anything else is `400`. Values are encrypted at rest (DPAPI on
        Windows, a key file on Linux).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /secrets/{secretId}:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    get:
      tags: [secrets]
      operationId: getSecret
      summary: Get details of a specific secret.
      responses:
        "200":
          description: Metadata only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [secrets]
      operationId: updateSecretMetadata
      summary: Update metadata of a specific secret.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [secrets]
      operationId: deleteSecret
      summary: Delete a specific secret.
      description: "`409` (`code: secret_in_use`) while referenced by a profile, client, SMB target or the backup settings."
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /secrets/{secretId}/value:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    put:
      tags: [secrets]
      operationId: replaceSecretValue
      summary: Rotate the value. Write-only; there is no GET for this path.
      description: Deployments scheduled before the rotation keep the value they were scheduled with.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretValue" }
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- settings
  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Get the current settings.
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      tags: [settings]
      operationId: replaceSettings
      summary: Replace the current settings.
      description: |
        Applied atomically: the new configuration is validated and every listener
        is bound before the old one is released; a listener whose address doesn't
        change keeps its socket. If anything fails (unknown interface, port in
        use, invalid pool), the running configuration is kept and `422` is
        returned with one `errors[]` entry per failure, e.g.
        `{ field: "interfaces[0].dhcp", message: "UDP 67 in use by svchost.exe (SharedAccess)" }`.
        Schema violations return `400` with the same `errors[]` shape.
        `backup.destination` is checked for form only (path shape, an existing
        `share-credential` secret), never by connecting: `422` on a bad one.

        Read-only fields (`etag`, `hasPassword`, `externalDhcpGuidance`) are
        ignored. Write-only fields keep their current value when omitted or null.
        Moving the admin listener binds the new address first and closes the old
        one a few seconds after this response; the `-admin-addr` flag overrides
        `admin` if you lock yourself out.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Applied.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /settings/content-ca:
    get:
      tags: [settings]
      operationId: getContentCaCertificate
      summary: CA certificate for the HTTPS content listener (to enrol in firmware for HTTPS boot).
      description: |
        The internal content CA (ADR 0028), created the first time an interface
        enables `services.https`. Boot images whose `serverUrls` are `https://`
        carry it in the agent's config; firmware needs it enrolled for HTTPS boot.
        `404` (`code: content_https_not_available`) until the CA exists.
      responses:
        "200":
          description: "PEM, or DER with `Accept: application/pkix-cert`."
          content:
            application/x-pem-file:
              schema: { type: string }
            application/pkix-cert:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          description: No content CA yet (no interface has enabled `services.https`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ---------------------------------------------------------------- dhcp
  /dhcp/leases:
    get:
      tags: [dhcp]
      operationId: listDhcpLeases
      summary: Current leases on interfaces running `full` DHCP.
      description: |
        Bound, unexpired leases, ordered by interface then address. Proxy mode
        never assigns addresses, so it has none; addresses declined after a
        conflict (DHCPDECLINE or a ping answer) are not listed.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: interface, in: query, schema: { type: string } }
        - { name: mac, in: query, schema: { $ref: "#/components/schemas/MacAddress" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DhcpLeasePage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- auth
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      security: []
      summary: Who is calling, and whether the first account still has to be created.
      responses:
        "200":
          description: Always 200; `signedIn` says whether the request is authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }

  /auth/sign-in:
    post:
      tags: [auth]
      operationId: signIn
      security: []
      summary: Sign in with a username and password; sets the session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
      responses:
        "200":
          description: Signed in. `Set-Cookie` carries the session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "401":
          description: "Wrong username or password (`code: bad_credentials`); the response doesn't say which."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "No account exists yet (`code: setup_required`): use `POST /auth/setup`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /auth/sign-out:
    post:
      tags: [auth]
      operationId: signOut
      summary: End this session and clear the cookie.
      security:
        - cookieAuth: []
      responses:
        "204": { description: Signed out. }
        "401": { $ref: "#/components/responses/Problem" }

  /auth/setup:
    post:
      tags: [auth]
      operationId: setUp
      security: []
      summary: Create the first account with the setup code, and sign it in.
      description: |
        Only while no account exists. The setup code is in the server's log and
        in `<data>/setup-code.txt`; both are made at startup and the file is
        deleted once the first account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Created and signed in. `Set-Cookie` carries the session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "403":
          description: "Wrong setup code (`code: bad_setup_code`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "An account already exists (`code: already_set_up`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /auth/session/password:
    put:
      tags: [auth]
      operationId: changeOwnPassword
      summary: Change the signed-in account's password; its other sessions end.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 256 }
      responses:
        "204": { description: Changed. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: "Wrong current password (`code: bad_credentials`), or an API token (`not_for_api_tokens`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  # ---------------------------------------------------------------- users
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List accounts.
      responses:
        "200":
          description: OK, ordered by username.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [users]
      operationId: createUser
      summary: Create an account (full admin rights).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409":
          description: "The username is taken, ignoring case (`code: username_taken`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete an account, ending its sessions and revoking the API tokens it created.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: "The last account can't be deleted (`code: last_user`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /users/{userId}/password:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    put:
      tags: [users]
      operationId: setUserPassword
      summary: Set another account's password; its sessions end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 256 }
      responses:
        "204": { description: Set. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- tokens
  /tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: List API tokens.
      description: Every account's tokens, newest first. Expired tokens are listed until revoked.
      responses:
        "200":
          description: OK (secrets never returned after creation).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create a new API token for the signed-in account.
      description: |
        Only with a session (`403 not_for_api_tokens` with a token). The secret
        (`ndt_` and 43 base64url characters) is returned once and stored as a
        SHA-256 hash. `expiresAt` must be in the future; null never expires.
        `Idempotency-Key` is not supported here: a replayed response would keep
        the secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                expiresAt: { type: string, nullable: true, format: date-time }
      responses:
        "201":
          description: Created. `secret` is shown exactly once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiToken"
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /tokens/{tokenId}:
    parameters:
      - { name: tokenId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke a specific API token.
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- agent
  /agent/check-in:
    post:
      tags: [agent]
      operationId: agentCheckIn
      security: []
      summary: First call from WinPE. Reports hardware identity; returns whether the machine is armed.
      description: |
        Unauthenticated by necessity (WinPE has no prior secret). Creates the client
        (`source: discovered`) if no client has any of the MACs, which covers
        interfaces in DHCP `off` mode; otherwise updates its hardware details.

        * `state: armed`: a client MAC has a `pending` deployment, and the request's
          source IP matches the address recently leased/offered to that MAC (when this
          server saw the DHCP exchange). The deployment moves to `running` and its
          agent token is returned. The agent shows `armed.countdownSeconds`, then
          deploys; any key opens the profile menu via `/agent/unlock` instead.
        * `state: locked`: no armed deployment. The agent shows the boot prompt
          described by `prompt`, and boots the local disk when it times out.

        A client that checks in while one of its deployments is `running` restarted
        during it: that deployment is marked `failed` (`code: restarted`) first. A
        successful deployment reports `complete` before rebooting (ADR 0025).

        Threat model: spoofing a MAC on the deployment LAN can claim an *armed*
        deployment's config, so treat unattend secrets accordingly. Starting a
        deployment on an un-armed machine requires the boot prompt password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentIdentity" }
      responses:
        "200":
          description: Armed or locked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCheckInResult" }
        "400": { $ref: "#/components/responses/Problem" }

  /agent/unlock:
    post:
      tags: [agent]
      operationId: agentUnlock
      security: []
      summary: Exchange the boot prompt password for a short session that can start a deployment.
      description: |
        `password` is required unless `Settings.bootPrompt.requirePassword` is false
        (debug mode), in which case it is ignored. Failed attempts are rate-limited
        per MAC and per source IP; `429` (`code: too_many_attempts`) carries
        `Retry-After`. `401` (`code: invalid_password`) for a wrong password, `403`
        (`code: password_not_configured`) when a password is required but none is set
        (only armed deployments can run then). `404` (`code: unknown_client`) if the
        client id was not returned by a check-in from this source IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string, description: From `/agent/check-in`. }
                password: { type: string, nullable: true, writeOnly: true }
      responses:
        "200":
          description: Unlocked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUnlockResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /agent/ipxe/unlock:
    post:
      tags: [agent]
      operationId: agentIpxeUnlock
      security: []
      summary: The iPXE boot prompt's password check (Linux profiles, ADR 0034).
      description: |
        Called by the generated iPXE script (`autoexec.ipxe`) of an HTTP(S) Boot
        client whose profile is Linux, after a key was pressed at its prompt.
        The form is what iPXE's `params` sends. The client is found by `mac`
        (a client record is created if there is none, as at DHCP time).

        Always answers `200` with an iPXE script, because iPXE shows a failed
        request only as an error number. With the right password (or in debug
        mode, `bootPrompt.requirePassword: false`, where `password` is
        ignored) the script is a menu of the deployable Linux profiles, the
        client's own (else the default) preselected; choosing one posts to
        `/agent/ipxe/start` with a single-use `unlockToken` valid for 10
        minutes and bound to this MAC. Otherwise the script says why (wrong
        password, too many attempts with the wait, no password configured)
        and returns to the firmware, which boots the next device. Failed
        attempts are rate-limited per MAC and per source IP, as for
        `/agent/unlock`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [mac, arch]
              properties:
                mac: { type: string, description: "The boot NIC's MAC, from iPXE's `${mac}`." }
                arch: { $ref: "#/components/schemas/Architecture" }
                # nullable: the request validator decodes an absent form
                # field as null.
                password: { type: string, writeOnly: true, nullable: true }
      responses:
        "200":
          description: An iPXE script.
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }

  /agent/ipxe/start:
    post:
      tags: [agent]
      operationId: agentIpxeStart
      security: []
      summary: Start a Linux deployment from iPXE and get its boot commands (ADR 0034).
      description: |
        Either `armed=true`, posted by the script of a client with a `pending`
        deployment after its countdown: that deployment becomes `running`
        (it's consumed, as at a Windows agent check-in). Or `profileId` with
        the `unlockToken` from `/agent/ipxe/unlock`: a deployment of that
        profile is created and started, snapshotting it as `POST /deployments`
        does; a `running` deployment of the client is marked `failed`
        (`code: superseded`) first and a `pending` one cancelled.

        Always answers `200` with an iPXE script: on success the boot commands
        (the distribution's shim through iPXE's `shim` command, the kernel with
        the generated command line, the initrd, `boot`), served from
        `/content/linux/<imageId>/`; for an automatic install (ADR 0035) the
        command line also has `autoinstall ds=nocloud;s=<seed URL>`, the
        deployment's NoCloud seed on plain HTTP, valid while it runs, and the
        installer reports progress (ADR 0036); an interactive install's
        deployment is marked `succeeded` here, as nothing reports on it; otherwise
        why not (no pending deployment,
        an expired or used token, a profile that isn't deployable), then back
        to the firmware.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [mac, arch]
              properties:
                mac: { type: string }
                arch: { $ref: "#/components/schemas/Architecture" }
                # nullable: the request validator decodes an absent form
                # field as null.
                armed: { type: boolean, nullable: true }
                profileId: { type: string, nullable: true }
                unlockToken: { type: string, writeOnly: true, nullable: true }
      responses:
        "200":
          description: An iPXE script.
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }

  /agent/deployments:
    post:
      tags: [agent]
      operationId: agentStartDeployment
      summary: Start a deployment from the boot prompt menu.
      security:
        - agentSessionAuth: []
      description: |
        Schedules and immediately starts (`running`) a deployment of `profileId` for
        the session's client, snapshotting the profile exactly as
        `POST /deployments` does, and returns its agent token. The deployment runs
        in the WinPE that is already booted, even if the profile names a different
        boot image. A `running` deployment for the same client (an agent that
        crashed or was rebooted) is marked `failed` (`code: superseded`) first; a
        `pending` one is cancelled. The session token is single-use.
        `404` (`code: profile_not_found`); `422` (`code: invalid_computer_name`,
        `missing_odj_blob`, `profile_invalid`), shown by the agent before it wipes anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId: { type: string }
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentToken" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /agent/deployment:
    get:
      tags: [agent]
      operationId: agentGetDeployment
      security:
        - agentAuth: []
      summary: Everything the agent needs to perform the install.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDeploymentPlan" }
        "401": { $ref: "#/components/responses/Problem" }

  /agent/unattend:
    get:
      tags: [agent]
      operationId: agentGetUnattend
      security:
        - agentAuth: []
      summary: The deployment's unattend file, rendered with its secrets.
      description: |
        The deployment's snapshotted unattend template (the built-in one unless the
        profile names another; ADR 0026, 0027), rendered on each request from the
        snapshot, its variables and its secret copies; never stored. Only while the
        deployment is `running`. The plan's `unattendUrl` points here.
      responses:
        "200":
          description: The unattend file.
          content:
            application/xml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }

  /agent/files/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    get:
      tags: [agent]
      operationId: agentGetFile
      summary: Download a file the deployment's plan lists (install image, OS driver files).
      security:
        - agentAuth: []
      description: |
        Supports `Range` (resumable downloads) and `HEAD`. Only files named by the
        deployment's plan, by SHA-256, while the deployment is `running`; anything
        else is `404`.
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206": { description: Partial content. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /agent/progress:
    post:
      tags: [agent]
      operationId: agentReportProgress
      summary: Report progress of the current deployment stage.
      security:
        - agentAuth: []
      description: |
        Stages move forward only; a report for an earlier stage than the current one
        is ignored (safe under retries). The agent reports at least once a minute
        (repeating the current stage) so a running deployment doesn't time out.
        `409` (`code: deployment_cancelled`): the deployment was cancelled; the agent
        finishes the command in progress, stops, uploads its logs and calls `complete`
        (ADR 0026).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProgress" }
      responses:
        "204": { description: Recorded. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /agent/logs:
    post:
      tags: [agent]
      operationId: agentUploadLogs
      summary: Upload logs for the current deployment stage.
      security:
        - agentAuth: []
      description: Also accepted for 30 minutes after the deployment was cancelled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/LogEntry" } }
      responses:
        "204": { description: Recorded. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /agent/complete:
    post:
      tags: [agent]
      operationId: agentComplete
      summary: Complete the current deployment with the final result.
      security:
        - agentAuth: []
      description: |
        Final result. Idempotent; the token is revoked afterwards. For a deployment
        cancelled meanwhile it is the agent's acknowledgement (accepted for 30 minutes;
        the status stays `cancelled`). After a successful
        install the agent applies the profile's `bootOrderAfterDeploy` first, so its
        outcome is in the deployment's logs, then reports the result, then reboots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [succeeded, failed] }
                message: { type: string }
      responses:
        "204": { description: Recorded. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-netdeploy-session
      description: The web UI's session, from `POST /auth/sign-in` or `/auth/setup` (ADR 0029).
    bearerAuth:
      type: http
      scheme: bearer
      description: Admin API token (`ndt_…`) from `POST /tokens` (ADR 0029).
    agentAuth:
      type: http
      scheme: bearer
      description: Short-lived, single-deployment token from `/agent/check-in` (armed) or `/agent/deployments`.
    agentSessionAuth:
      type: http
      scheme: bearer
      description: Short-lived, single-use boot prompt session from `/agent/unlock`.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string }
    ImageId:
      name: imageId
      in: path
      required: true
      schema: { type: string }
    BootImageId:
      name: bootImageId
      in: path
      required: true
      schema: { type: string }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string }
    ClientId:
      name: clientId
      in: path
      required: true
      schema: { type: string }
    SecretId:
      name: secretId
      in: path
      required: true
      schema: { type: string }
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: { type: string }

  responses:
    Problem:
      description: Error (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyAttempts:
      description: "Too many failed attempts from this address or for this username (`code: too_many_attempts`)."
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    JobAccepted:
      description: Accepted; work continues in the background.
      headers:
        Location: { schema: { type: string }, description: URL of the job. }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Job" }

  schemas:
    # ---------- common
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable code, e.g. `image_in_use`, `build_in_progress`.
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    BootImagePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BootImage" } }
        nextCursor: { type: string, nullable: true }

    ClientPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Client" } }
        nextCursor: { type: string, nullable: true }

    DeploymentPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Deployment" } }
        nextCursor: { type: string, nullable: true }

    DhcpLeasePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DhcpLease" } }
        nextCursor: { type: string, nullable: true }

    DriverGroupPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DriverGroup" } }
        nextCursor: { type: string, nullable: true }

    DriverPackagePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DriverPackage" } }
        nextCursor: { type: string, nullable: true }

    ImagePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Image" } }
        nextCursor: { type: string, nullable: true }

    JobPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Job" } }
        nextCursor: { type: string, nullable: true }

    LogEntryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LogEntry" } }
        nextCursor: { type: string, nullable: true }

    ProfilePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Profile" } }
        nextCursor: { type: string, nullable: true }

    SecretPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Secret" } }
        nextCursor: { type: string, nullable: true }

    UnattendTemplatePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/UnattendTemplate" } }
        nextCursor: { type: string, nullable: true }

    Meta:
      type: object
      required: [id, etag, createdAt, updatedAt]
      properties:
        id: { type: string, readOnly: true }
        etag: { type: string, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }

    Variables:
      type: object
      description: Template variables (string values only, to keep rendering predictable).
      additionalProperties: { type: string }

    MacAddress:
      type: string
      pattern: "^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$"
      description: |
        Six hex pairs separated by `:` or `-`, any case. The server normalises
        input; responses are always lower-case and colon-separated.

    Architecture:
      type: string
      enum: [x64, arm64]

    ValidationResult:
      type: object
      required: [ok, findings]
      properties:
        ok: { type: boolean }
        findings:
          type: array
          items: { $ref: "#/components/schemas/ValidationFinding" }

    ValidationFinding:
      type: object
      required: [severity, code, message]
      properties:
        severity: { type: string, enum: [error, warning, info] }
        code: { type: string }
        message: { type: string }
        line:
          type: integer
          nullable: true
          description: For unattend template findings, the line of the rendered file, when known.

    # ---------- system
    Health:
      type: object
      required: [status, services]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version:
          type: string
          description: |
            The server's version (a release tag such as `0.6.0`, or
            `0.6.0-3-gabc1234` between releases; ADR 0031). Only for a signed-in
            caller, like everything but the statuses.
        services:
          type: object
          description: |
            Keyed by service: `store` (the database), `storage` (the content
            store), `admin`, `dhcp`, `tftp`, `content`. `storage`
            is `error` when the content store is unusable or a stored file is
            missing or truncated (ADR 0015); `detail` says which.
          additionalProperties: { $ref: "#/components/schemas/ServiceHealth" }
        storage: { $ref: "#/components/schemas/StorageHealth" }
        backup: { $ref: "#/components/schemas/BackupHealth" }
        warnings:
          type: array
          description: |
            Configuration the operator should know about; does not change `status`.
            Codes: `boot_prompt_password_disabled` (debug mode: anyone at a machine can
            re-image it), `boot_prompt_no_password` (only armed deployments can run),
            `no_default_profile` (unknown clients are not answered), `storage_low`
            (free space in the content store is below twice `storage.reserveBytes`),
            `backup_failed` (the last backup failed), `backup_overdue` (scheduled
            backups haven't succeeded for two intervals), `secrets_key_not_exported`
            (secrets exist but the key was never exported with `netdeployd key
            export`; without it they can't be restored on other hardware, ADR 0021),
            `admin_certificate_expiring` (the admin certificate expires within 30
            days, or has expired), `content_ca_expiring` (the content CA expires
            within a year, or has expired; ADR 0028), `missing_privileges` (the
            server lacks a privilege a configured service needs: binding ports
            below 1024, raw ICMP, or elevation for DISM; the message says which
            and how to grant it; ADR 0030), `dhcp_ping_unavailable` (full-mode
            DHCP has the ping check on but no ICMP socket can be opened, so
            addresses are offered unchecked), `data_dir_permissions` (Linux:
            the data directory, the database or a key file in it can be read by
            other users, or isn't owned by the server's account; Windows: its
            access list lets Everyone, Authenticated Users, Users or Interactive
            read it, which matters because the secrets key is protected with
            machine-scope DPAPI; ADR 0030, 0031), `http_boot_unavailable`
            (`architectures.httpBoot` is on but HTTP Boot clients can't be
            answered: the iPXE bundle is missing or lacks an enabled
            architecture, or no interface with DHCP serves content over HTTP or
            HTTPS; ADR 0032).
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }

    BackupHealth:
      type: object
      description: Backups (ADR 0020). Absent fields mean "never".
      properties:
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        lastFailureAt: { type: string, format: date-time, nullable: true }
        lastError:
          type: string
          nullable: true
          description: The last failure's detail, if it is newer than the last success.
        nextRunAt:
          type: string
          format: date-time
          nullable: true
          description: Next scheduled run; null when `backup.schedule.frequency` is `disabled` or no destination is set.

    Backup:
      type: object
      description: One snapshot at the destination (ADR 0020).
      required: [id, createdAt, trigger, serverVersion, schemaVersion, blobCount, blobBytes, databaseBytes]
      properties:
        id: { type: string, description: "Snapshot directory name, the UTC start time, e.g. `20261108T020000Z`." }
        createdAt: { type: string, format: date-time }
        trigger: { type: string, enum: [scheduled, manual, offline] }
        serverVersion: { type: string }
        schemaVersion: { type: integer, description: Database schema version; restore needs a server at least this new. }
        blobCount: { type: integer, description: Stored files this snapshot references. }
        blobBytes: { type: integer, format: int64, description: Their total size (shared with other snapshots). }
        databaseBytes: { type: integer, format: int64 }
        secretsKeyFingerprint:
          type: string
          nullable: true
          description: SHA-256 of the secrets key at backup time (ADR 0021); null if there were no secrets.

    StorageHealth:
      type: object
      description: Space on the content store's volume (ADR 0015).
      required: [totalBytes, freeBytes, contentBytes, uploadBytes, reserveBytes]
      properties:
        totalBytes: { type: integer, format: int64, description: Size of the volume. }
        freeBytes: { type: integer, format: int64, description: Free space available to netdeployd. }
        contentBytes: { type: integer, format: int64, description: Total size of the stored files (each counted once). }
        uploadBytes: { type: integer, format: int64, description: "Bytes held by uploads, including imported ones kept until deleted." }
        reserveBytes: { type: integer, format: int64, description: "`storage.reserveBytes`: space imports never use." }

    ServiceHealth:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, disabled, error] }
        detail: { type: string }
        bindFailures:
          type: array
          items: { $ref: "#/components/schemas/BindFailure" }

    Capabilities:
      type: object
      required: [hostOs, builders, version]
      properties:
        version: { type: string }
        hostOs: { type: string, enum: [windows, linux] }
        builders:
          type: array
          items:
            type: object
            required: [name, available]
            properties:
              name: { $ref: "#/components/schemas/BuilderName" }
              available: { type: boolean }
              version:
                type: string
                description: |
                  Tool version (DISM version for `dism`). DISM cannot reliably
                  service images newer than itself; validation compares this with
                  the source image build.
              reason: { type: string, description: "Why unavailable, if not available (e.g. DISM when the server isn't elevated)." }
              path: { type: string, description: "The tool used (wimlib: from `-wimlib` or PATH)." }
        contentHttps:
          type: boolean
          description: Whether this server can serve content over HTTPS (`services.https`, ADR 0028).
        elevated:
          type: boolean
          description: "Windows hosts: whether the server runs elevated (DISM needs it). Always false on Linux."
        privileges:
          type: object
          description: |
            What this process may do (ADR 0030). Linux: from its effective
            capabilities (`CAP_NET_BIND_SERVICE`, `CAP_NET_RAW`) or root, and
            `net.ipv4.ip_unprivileged_port_start`. Windows: elevation.
          required: [lowPorts, icmp]
          properties:
            lowPorts: { type: boolean, description: "May bind ports below 1024 (DHCP 67, TFTP 69, HTTP 80, HTTPS 443)." }
            icmp:
              type: string
              enum: [raw, datagram, none]
              description: |
                How the DHCP ping check sends echo requests: `raw` (raw socket),
                `datagram` (Linux's unprivileged ICMP socket, allowed by
                `net.ipv4.ping_group_range`), or `none` (the check is skipped).
            missing:
              type: array
              items: { type: string }
              description: "Privileges to grant, e.g. `CAP_NET_RAW`; empty when nothing is missing."
        agent:
          type: object
          description: The WinPE agent bundled with this server (ADR 0022).
          required: [version, architectures]
          properties:
            version: { type: string }
            architectures:
              type: array
              items: { $ref: "#/components/schemas/Architecture" }
              description: Architectures with a bundled agent binary; empty in a build without agents.
        adk:
          type: object
          description: Windows ADK / WinPE add-on, needed only for optional components.
          properties:
            installed: { type: boolean }
            version: { type: string, nullable: true }
        httpBoot:
          type: object
          description: |
            The signed iPXE chain HTTP(S) Boot clients get (ADR 0032): read at start
            from `ipxe/<arch>/` next to the executable, or `-ipxe-dir`.
          required: [available, architectures]
          properties:
            available: { type: boolean, description: At least one architecture has a complete set. }
            architectures:
              type: array
              items: { $ref: "#/components/schemas/Architecture" }
              description: Architectures with all three files (`ipxe-shim.efi`, `ipxe.efi`, `wimboot`).
            path: { type: string, description: The directory read. }
            reason: { type: string, description: "Why unavailable, if not available." }
            files:
              type: array
              items:
                type: object
                required: [architecture, name, size, sha256]
                properties:
                  architecture: { $ref: "#/components/schemas/Architecture" }
                  name: { type: string, enum: [ipxe-shim.efi, ipxe.efi, wimboot] }
                  size: { type: integer, format: int64 }
                  sha256: { type: string }
        cabLzx:
          type: object
          description: |
            Whether LZX-compressed CABs (common for Microsoft Update Catalog drivers) can
            be imported: `expand.exe` on Windows, `cabextract` on Linux (ADR 0019).
          required: [available]
          properties:
            available: { type: boolean }
            tool: { type: string, nullable: true }
            reason: { type: string }

    HostInterface:
      type: object
      description: A network interface of the server's machine.
      required: [name, addresses, up, loopback]
      properties:
        name:
          type: string
          description: |
            What the operating system calls it: on Windows the friendly name shown
            in Network Connections (`Ethernet 2`, `vEthernet (Lab)`), on Linux the
            device name (`enp3s0`).
        mac:
          type: string
          nullable: true
          description: Lower-case, colon-separated. Null for interfaces without one (loopback, tunnels).
        addresses:
          type: array
          description: IPv4 addresses, the primary one first. Empty when it has none.
          items: { $ref: "#/components/schemas/HostInterfaceAddress" }
        up: { type: boolean, description: Enabled and connected. }
        loopback: { type: boolean }

    HostInterfaceAddress:
      type: object
      required: [address, prefixLength]
      properties:
        address: { type: string, format: ipv4 }
        prefixLength: { type: integer, minimum: 0, maximum: 32, description: "Subnet size, e.g. 24 for 255.255.255.0." }

    Event:
      type: object
      required: [type, at]
      properties:
        type:
          type: string
          enum: [client.updated, lease.updated, settings.updated, health.updated, job.updated, deployment.updated, bootImage.updated, image.updated, driverPackage.updated, profile.updated, session.ended]
        at: { type: string, format: date-time }
        resourceId: { type: string }
        data:
          type: object
          description: |
            Depends on `type`:
            * `client.updated`: `{id, mac, change}`, `change` one of `created`,
              `updated`, `deleted`, `seen` (a network boot; at most every 30 s per
              MAC). `resourceId` is the client id.
            * `lease.updated`: `{interface, ip, mac, change}`, `change` one of
              `bound`, `released`, `declined` (full-mode DHCP).
            * `settings.updated`: `{etag}`.
            * `health.updated`: the `Health` object, after listeners change.
            * `job.updated`: `{kind, status, percent, resourceId}` (`resourceId`
              in `data` is the job's resource; the event's `resourceId` is the
              job id). Sent when the status changes and at most twice a second
              for progress.
            * `image.updated`, `driverPackage.updated`: the resource changed
              (created, import finished, edited); `data.change` is `deleted`
              when it was deleted. `resourceId` is the image or package id.
            * `deployment.updated`, `bootImage.updated`: from Phase 4.
            * `session.ended`: `{reason}`, sent only on the streams of the session
              or token that ended, which then close (ADR 0029). `reason` is
              `password_changed` (the account's password was changed or set; the
              session that changed it is kept), `account_deleted`, `signed_out`,
              `token_revoked` or `expired` (noticed within 15 s). The UI shows
              the sign-in page at once.

    # ---------- images
    ImageKind:
      type: string
      enum: [windows, linux, other]

    SecureBootSigner:
      type: string
      enum: [windows-pca-2011, windows-uefi-ca-2023, uefi-ca-2011, uefi-ca-2023, unsigned, unknown]

    ImageImport:
      type: object
      required: [uploadId, name]
      properties:
        uploadId: { type: string }
        name: { type: string }
        retainIso:
          type: boolean
          default: false
          description: |
            Keep the original ISO alongside the extracted files. Only needed for
            features that serve the whole ISO. Ubuntu media always keeps it,
            whatever this says, because its installer downloads the whole ISO
            (`url=`, ADR 0033); `retainIso` on the image then reads `true`.
            The ISO is hardlinked from the upload where the volume allows, so it
            costs no extra space while the upload is also kept.

    ImageUpdate:
      type: object
      properties:
        name: { type: string }
        notes: { type: string }

    Image:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [name, kind, status, retainIso]
          properties:
            name: { type: string }
            notes: { type: string }
            kind:
              type: string
              nullable: true
              allOf: [{ $ref: "#/components/schemas/ImageKind" }]
              description: Null while importing.
            status: { type: string, enum: [importing, ready, failed] }
            sourceFilename:
              type: string
              nullable: true
              description: The uploaded ISO's file name (from the upload's metadata).
            volumeLabel:
              type: string
              nullable: true
              description: The ISO's volume label, e.g. `CPBA_X64FRE_EN-GB_DV9`.
            uploadId:
              type: string
              nullable: true
              description: The upload it was imported from; null once that upload is deleted.
            warnings:
              type: array
              items: { type: string }
              description: Things the import couldn't do that don't make it fail (e.g. a `boot.wim` it couldn't read).
            error:
              nullable: true
              type: object
              allOf:
                - $ref: "#/components/schemas/Problem"
              description: Why the import failed (when `status` is `failed`).
            sizeBytes: { type: integer, format: int64, description: Size of the ISO. }
            sha256: { type: string, description: SHA-256 of the ISO. }
            retainIso: { type: boolean }
            details:
              description: Kind-specific metadata. Absent until the import finishes.
              oneOf:
                - $ref: "#/components/schemas/WindowsImageDetails"
                - $ref: "#/components/schemas/LinuxImageDetails"
                - $ref: "#/components/schemas/OtherImageDetails"
              discriminator:
                propertyName: kind
                mapping:
                  windows: "#/components/schemas/WindowsImageDetails"
                  linux: "#/components/schemas/LinuxImageDetails"
                  other: "#/components/schemas/OtherImageDetails"

    WindowsImageDetails:
      type: object
      required: [kind, architecture, installImageFormat, editions, bootManagers, bootImageIndexes]
      properties:
        kind: { type: string, enum: [windows] }
        architecture: { $ref: "#/components/schemas/Architecture" }
        installImageFormat:
          type: string
          enum: [wim, esd, swm]
          description: "`swm` = split WIM (install.swm, install2.swm, ...)."
        editions:
          type: array
          items: { $ref: "#/components/schemas/WindowsEdition" }
        bootImageIndexes:
          type: array
          description: Images inside boot.wim (index 1 = WinPE, 2 = Windows Setup on standard media).
          items:
            type: object
            properties:
              index: { type: integer }
              name: { type: string }
        bootManagers:
          type: array
          description: Every boot manager found on the media and inside its WIMs.
          items: { $ref: "#/components/schemas/BootManager" }

    WindowsEdition:
      type: object
      required: [index, name]
      properties:
        index: { type: integer, minimum: 1 }
        name: { type: string, description: "Display name, e.g. Windows 11 Pro." }
        editionId: { type: string, description: "e.g. Professional, Enterprise." }
        build: { type: string, description: "e.g. 26100.1742" }
        architecture: { $ref: "#/components/schemas/Architecture" }
        languages: { type: array, items: { type: string }, description: "e.g. en-GB." }
        defaultLanguage: { type: string }
        sizeBytes: { type: integer, description: Expanded size of this edition. }

    BootManager:
      type: object
      required: [signer, sourcePath, sha256]
      properties:
        signer: { $ref: "#/components/schemas/SecureBootSigner" }
        signers:
          type: array
          items: { $ref: "#/components/schemas/SecureBootSigner" }
          description: |
            Every Microsoft CA the binary's signatures chain to (ADR 0033), e.g.
            `[uefi-ca-2011, uefi-ca-2023]` for a dual-signed shim. Empty when
            none does. `signer` is the first of them, `unknown` for a binary
            signed only by another key (see `signedBy`), or `unsigned`.
        signedBy:
          type: array
          items: { type: string }
          description: |
            The subject of each verified signing certificate, e.g.
            `CN=Canonical Ltd. Secure Boot Signing (2022 v1),…` for a kernel
            signed with a distribution's own key.
        sourcePath:
          type: string
          description: Where it was found, e.g. `efi/boot/bootx64.efi` or `boot.wim:2/Windows/Boot/EFI_EX/bootmgfw_EX.efi`.
        sha256: { type: string }
        architecture: { $ref: "#/components/schemas/Architecture" }

    LinuxFamily:
      type: string
      enum: [ubuntu, debian, redhat]
      description: |
        How the installer is booted and automated (ADR 0033): `ubuntu` =
        casper and Subiquity (autoinstall); `debian` = debian-installer
        (preseed); `redhat` = Anaconda (kickstart), for Fedora, RHEL and its
        rebuilds.

    LinuxImageDetails:
      type: object
      required: [kind, family, architecture, boot, deployable]
      properties:
        kind: { type: string, enum: [linux] }
        family: { $ref: "#/components/schemas/LinuxFamily" }
        distribution:
          type: string
          description: e.g. `Ubuntu-Server`, `Debian GNU/Linux`, `Rocky Linux`.
        version: { type: string, description: e.g. `26.04.1`. }
        architecture: { $ref: "#/components/schemas/Architecture" }
        description:
          type: string
          description: The media's own description (`.disk/info`, or the `.treeinfo` name and version).
        boot:
          type: object
          required: [kernel, initrd]
          description: |
            The files a network boot loads (paths relative to the image's root).
            `shim` is the distribution's own `EFI/BOOT/BOOTX64.EFI` (or
            `BOOTAA64.EFI`), which iPXE's `shim` command starts the kernel
            through under Secure Boot (Phase 7 findings).
          properties:
            shim: { $ref: "#/components/schemas/BootManager" }
            grub: { $ref: "#/components/schemas/BootManager" }
            kernel: { $ref: "#/components/schemas/BootManager" }
            initrd:
              type: object
              required: [sourcePath, sha256]
              properties:
                sourcePath: { type: string }
                sha256: { type: string }
        deployable:
          type: boolean
          description: Whether profiles can deploy it. Only `ubuntu` for now.
        deployableReason:
          type: string
          description: Why not, when `deployable` is false.

    OtherImageDetails:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [other] }
        bootFiles:
          type: array
          description: EFI binaries found, with signers, for manual boot configuration.
          items: { $ref: "#/components/schemas/BootManager" }

    # ---------- drivers
    DriverRole:
      type: string
      enum: [network, storage, other]
      description: |
        Derived from the INF class: `Net` → network; `SCSIAdapter`, `HDC` → storage;
        everything else → other. Storage drivers are boot-critical.

    DriverSignature:
      type: string
      enum: [whql, vendor, unsigned, unknown]
      description: |
        `whql` = catalog signed by Microsoft (WHQL, attestation or inbox signing);
        `vendor` = catalog signed by the vendor's own certificate;
        `unsigned` = no catalog, no valid signature, or a file the INF installs isn't
        covered by the catalog;
        `unknown` = catalog present but it can't be evaluated here (e.g. an
        unsupported algorithm). `DriverInf.signatureDetail` says why for anything
        but `whql`.
        Boot images reject `unsigned` drivers: x64 WinPE under Secure Boot won't load them.

    DriverInf:
      type: object
      required: [id, path, class, role, enabled, signature, architectures]
      properties:
        id: { type: string, readOnly: true }
        path: { type: string, description: Path of the INF inside the package. }
        class: { type: string, description: "INF class, e.g. Net, SCSIAdapter, HDC." }
        role: { $ref: "#/components/schemas/DriverRole" }
        bootCritical:
          type: boolean
          readOnly: true
          description: "Equals `role == storage`: must be present before the agent runs."
        provider: { type: string }
        version: { type: string }
        driverDate: { type: string, format: date }
        architectures:
          type: array
          items: { $ref: "#/components/schemas/Architecture" }
          description: |
            From the INF's decorations (`NTamd64`, `NTarm64`; undecorated means all).
            Empty when it supports neither x64 nor arm64; such INFs start disabled.
        targetOsVersions:
          type: array
          description: |
            From the INF's [Manufacturer] decorations, e.g. `10.0...22000`
            (Windows 11 21H2+). Empty means no OS version restriction.
          items: { type: string }
        hardwareIds: { type: array, items: { type: string } }
        signature: { $ref: "#/components/schemas/DriverSignature" }
        signer: { type: string, nullable: true, description: Certificate subject of the catalog signer. }
        signatureDetail:
          type: string
          nullable: true
          description: Why the signature isn't `whql`, e.g. `e1r68x64.sys is not in e1r68x64.cat`.
        enabled:
          type: boolean
          default: true
          description: Disabled INFs are skipped when the package is injected.

    DriverPackage:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [name, status, infs]
          properties:
            name: { type: string }
            status: { type: string, enum: [importing, ready, failed] }
            error:
              nullable: true
              type: object
              allOf:
                - $ref: "#/components/schemas/Problem"
            sha256: { type: string, description: SHA-256 of the archive. }
            sizeBytes: { type: integer, format: int64, description: Size of the archive. }
            sourceFilename: { type: string, nullable: true, description: The uploaded archive's file name. }
            uploadId: { type: string, nullable: true, description: The upload it was imported from; null once deleted. }
            warnings: { type: array, items: { type: string } }
            infs:
              type: array
              items: { $ref: "#/components/schemas/DriverInf" }

    DriverPackageUpdate:
      type: object
      properties:
        name: { type: string }
        infs:
          type: array
          description: Only the INFs being changed; unknown INF ids return `400`.
          items:
            type: object
            required: [id, enabled]
            properties:
              id: { type: string }
              enabled: { type: boolean }

    DriverGroupInput:
      type: object
      required: [name, driverPackageIds]
      properties:
        name: { type: string }
        description: { type: string }
        driverPackageIds: { type: array, items: { type: string }, uniqueItems: true }

    DriverGroup:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - $ref: "#/components/schemas/DriverGroupInput"

    # ---------- boot images
    BuilderName:
      type: string
      enum: [dism, wimlib]

    WinPeOptionalComponent:
      type: string
      description: WinPE optional component name (DISM + matching ADK only).
      enum:
        - WinPE-WMI
        - WinPE-NetFx
        - WinPE-Scripting
        - WinPE-PowerShell
        - WinPE-StorageWMI
        - WinPE-DismCmdlets
        - WinPE-SecureStartup
        - WinPE-EnhancedStorage

    BootImageInput:
      type: object
      required: [name, sourceImageId, architecture, serverUrls]
      properties:
        name: { type: string }
        sourceImageId: { type: string, description: A `windows` Image. }
        sourceIndex:
          type: integer
          minimum: 1
          description: |
            Index inside boot.wim. Must be one of the image's `bootImageIndexes`.
            When omitted on create, boot.wim's own boot index (from its header) is
            used: the Windows Setup image, 2 on install media. Use the Setup image:
            plain WinPE (index 1) cannot run DISM offline servicing, so the agent
            cannot add OS drivers from it (ADR 0022 amendment, Phase 5 findings).
            The agent replaces Setup's shell, so Setup itself never starts.
        architecture: { $ref: "#/components/schemas/Architecture" }
        driverGroupIds: { type: array, items: { type: string }, uniqueItems: true }
        agentVersion:
          type: string
          description: |
            Defaults to the bundled agent; only the bundled version
            (`Capabilities.agent.version`) is accepted for now.
        serverUrls:
          type: array
          minItems: 1
          items: { type: string, format: uri }
          description: |
            Baked into the image as the agent's config; tried in order. Changing
            the server's address therefore marks images `stale`. All `http://` or
            all `https://` (`422 mixed_server_urls` otherwise), so the agent can't
            be pushed onto plain HTTP. With `https://` the image also carries the
            content CA, and the agent trusts only that CA (ADR 0028).
        builder:
          type: string
          enum: [auto, dism, wimlib]
          default: auto
          description: |
            `auto` uses `wimlib` when `wimlib-imagex` is available, else `dism` (the
            server elevated on Windows, DISM not older than the image). `dism` injects
            drivers into WinPE's driver store; with `wimlib` they are staged as files
            and the agent loads them with `drvload` before it looks at disks. WinPE
            runs from a RAM disk, so storage drivers (RAID, VMD) work either way
            (ADR 0022).
        optionalComponents:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/WinPeOptionalComponent" }
          description: |
            Requires the `dism` builder and an ADK matching the image build. Empty by
            default. Not implemented yet: a non-empty list is refused with `422`
            (`code: not_implemented`).
        bootmgr:
          type: string
          enum: [auto, windows-pca-2011, windows-uefi-ca-2023]
          default: auto
          description: |
            Which signed boot manager to serve, chosen from the source image's
            `bootManagers`. `auto` serves the 2023-signed one when the image has it,
            otherwise the 2011-signed one. Fails validation if the requested
            variant isn't present in the source image.
        tftp:
          type: object
          description: |
            Written into the BCD as what Boot Manager *requests* when it downloads
            boot.sdi and boot.wim. The server answers with the lower of this and
            `Settings.tftp`. The defaults match the server's default caps (8192/8, the
            fastest setting that never lost a packet in Phase 1), so a new setup has no
            `tftp_capped_by_server` warning. Raise them, and the caps, only where the
            network allows; lower them for hardware that must request less, e.g. 1456 on a
            network that drops IP fragments. Changing them needs a rebuild. (Until
            2026-11-16 the defaults were 16384/16, always capped to 8192/8.)
          properties:
            blockSize:
              type: integer
              minimum: 512
              maximum: 16384
              default: 8192
              description: "`ramdisktftpblocksize`."
            windowSize:
              type: integer
              minimum: 1
              maximum: 64
              default: 8
              description: "`ramdisktftpwindowsize`."
        produceHttpBootIso:
          type: boolean
          default: false
          description: |
            Also build a small bootable ISO (bootmgr + BCD + boot.wim) for UEFI HTTP
            Boot, which the firmware loads as a RAM disk. Firmware support varies.
            Not implemented: `true` is refused with `422` (`code:
            not_implemented`). HTTP(S) Boot clients get the signed iPXE chain
            instead (ADR 0032); the ISO is kept for firmware that trusts only
            the Windows CA.

    BootArtifact:
      type: object
      description: |
        One file of a built boot image's tree, served to the clients that boot it
        (ADR 0006, 0022): `bootmgfw.efi`, `Boot/BCD`, `Boot/boot.sdi`, `Boot/boot.wim`
        and `EFI/Microsoft/Boot/Fonts/*.ttf`.
      required: [kind, path, sha256, sizeBytes]
      properties:
        kind: { type: string, enum: [wim, bcd, bootmgr, sdi, font, http-boot-iso] }
        path: { type: string, description: "Path in the tree, e.g. `Boot/boot.wim`; the TFTP path is `\\` plus this with backslashes." }
        sha256: { type: string }
        sizeBytes: { type: integer }

    BootImage:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - $ref: "#/components/schemas/BootImageInput"
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [draft, building, ready, stale, failed]
              description: |
                `draft`: never built. `building`: a build is queued or running.
                `ready`: built from the current inputs. `stale`: built, but the inputs
                have changed since (`staleReasons`). `failed`: the last build failed.
                Whatever the status, a boot image with `artifacts` keeps serving its
                last good build.
            staleReasons:
              type: array
              readOnly: true
              description: What changed since the last build (only when `stale`).
              items:
                type: string
                enum: [source-image, source-index, architecture, builder, agent, server-urls, content-ca, bootmgr, tftp, drivers, recipe]
            inputHash:
              type: string
              readOnly: true
              nullable: true
              description: |
                `inputHash` of the build being served (ADR 0022): a hash of every build
                input (recipe version, the source boot.wim, index, architecture, resolved
                builder, agent binary, serverUrls, bootmgr choice, TFTP settings and the
                enabled INFs of the selected driver groups).
            builtWith: { $ref: "#/components/schemas/BuilderName" }
            builtAt: { type: string, nullable: true, format: date-time }
            selectedBootManager:
              nullable: true
              type: object
              allOf:
                - $ref: "#/components/schemas/BootManager"
              description: The boot manager actually used by the last build.
            canAddOsDrivers:
              type: boolean
              readOnly: true
              nullable: true
              description: |
                Whether the served build can add OS drivers during a deployment: true
                when the built WinPE contains the WinPE-Setup package (the Setup image),
                which DISM offline servicing needs. Null until built (or for builds made
                before this was recorded: rebuild to find out).
            artifacts:
              type: array
              items: { $ref: "#/components/schemas/BootArtifact" }
            warnings: { type: array, items: { type: string } }
            error:
              nullable: true
              type: object
              allOf:
                - $ref: "#/components/schemas/Problem"
            lastJobId: { type: string, nullable: true }
            sizeBytes:
              type: integer
              readOnly: true
              nullable: true
              description: Total size of the served build's files.

    # ---------- unattend
    UnattendFormat:
      type: string
      enum: [unattend, autoinstall]
      description: |
        `unattend`: a Windows unattend file for Windows profiles (ADR 0027).
        `autoinstall`: an Ubuntu autoinstall `user-data` document for Linux
        profiles (ADR 0035). A template's format can't change.

    UnattendTemplateInput:
      type: object
      required: [name, content, identityModes]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        format:
          allOf: [{ $ref: "#/components/schemas/UnattendFormat" }]
          default: unattend
        content:
          type: string
          maxLength: 262144
          description: |
            Go `text/template` producing the whole unattend file (ADR 0027). Parsed
            with `missingkey=error`, so a missing field or undeclared variable fails
            when the template is saved. Data:

            * `.Arch`: `amd64` or `arm64`, from the install image.
            * `.InstallMethod`: `agent` (`smb` later). Agent-mode output has its
              `windowsPE` pass removed.
            * `.ComputerName`: the rendered name pattern; empty when Windows picks
              the name or the ODJ blob names the computer.
            * `.OS`: `UILanguage`, `SystemLocale`, `UserLocale`, `InputLocale`,
              `TimeZone`, `ProductKey`†.
            * `.Identity`: `Mode`, `HideEULA`, `HideOOBE`; `Accounts` (list of
              `Name`, `DisplayName`, `Group`, `Password`†: local accounts, and `ad`'s
              break-glass administrator); `AutoLogon` (`Username`, `Password`†,
              `Count`) or nil; `Join` (`Domain`, `Username`, `Password`†,
              `JoinDomain`, `OU`) or nil, for `ad` credentials; `ODJ`
              (`AccountData`†) or nil, for `ad` offline join.
            * `.Client`: `ID`, `MAC`, `Serial`, `SMBIOSUUID`, `Hostname`.
            * `.Profile`: `ID`, `Name`. `.Deployment`: `ID` (`preview` in previews).
            * `.Variables`: template `variableDefaults` < profile < client.

            † Secret values, already in the form the unattend file wants (passwords
            encoded as for `PlainText false`; ODJ `AccountData` as Setup reads it).
            Previews show `********` and never decrypt anything.

            Functions: `first n`, `last n`, `upper`, `lower` (as computer name
            patterns), `default "value" x`, and `raw`. Every value an action writes
            is XML-escaped; only a value passed through `raw` is written unescaped.

            **`autoinstall` templates** (ADR 0035) write the whole `user-data`
            document (`#cloud-config` with `autoinstall:`). Data:

            * `.Arch`: `amd64` or `arm64`.
            * `.Hostname`: the rendered `linux.hostnamePattern`.
            * `.Account`: `Username`, `RealName`, `PasswordHash`† (SHA-512 crypt,
              `$6$…`; empty without a password), `SSHAuthorizedKeys` (list),
              `SSHPasswordAuth`.
            * `.Locale`, `.KeyboardLayout`, `.Timezone`, `.StorageLayout`
              (`lvm` or `direct`), `.Packages` (list), `.BootOrderAfterDeploy`.
            * `.Image`: `Distribution`, `Version`. `.Client`, `.Profile`,
              `.Deployment`, `.Variables` as above.
            * `.Report`: `Webhook` (for `reporting:` as a `webhook`
              endpoint), `Started`, `Finished`, `Failed`: URLs the installer
              POSTs to (ADR 0036). Events move the deployment's stage and
              percent; `Finished` marks it `succeeded`, `Failed` (or a failed
              install event) `failed`. Previews show a placeholder address.

            † Previews show `********`; the hash is made when the installer
            fetches `user-data`, with a new salt each time.

            Every value an action writes becomes YAML: strings as double-quoted
            scalars (JSON strings), numbers and booleans as they are, lists as
            flow sequences. `raw` writes a value as it is; `shquote` quotes a
            string for a shell command (wrap the result in `raw` inside a YAML
            block scalar).
        identityModes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/IdentityMode" }
          description: |
            `unattend` templates: identity modes this template renders, at least
            one. Each is checked on save with sample data: `local` must produce
            every account and the auto-logon, `ad` the `UnattendedJoin` for both
            join methods (ADR 0027). `autoinstall` templates: empty.
        variableDefaults: { $ref: "#/components/schemas/Variables" }
        requiredVariables:
          type: array
          uniqueItems: true
          items: { type: string }
          description: |
            Variables a deployment must have a value for (from the profile or the
            client); arming refuses without them (`missing_variable`). A variable the
            template uses must be here or in `variableDefaults`.

    UnattendTemplate:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - $ref: "#/components/schemas/UnattendTemplateInput"
        - type: object
          required: [builtIn]
          properties:
            builtIn:
              type: boolean
              readOnly: true
              description: |
                A shipped template: `builtin` (unattend, all identity modes the
                server supports) or `builtin-autoinstall`. Read-only: create a copy
                to customise it. A profile with no `unattendTemplateId` uses its
                kind's built-in template.

    UnattendRenderRequest:
      type: object
      properties:
        profileId:
          type: string
          nullable: true
          description: Render with this profile's data and run the checks arming runs.
        clientId:
          type: string
          nullable: true
          description: The client whose fields and variables to use.
        identityMode:
          allOf:
            - $ref: "#/components/schemas/IdentityMode"
          description: |
            Without a profile: which mode's sample data to render (default: the
            template's first). With a profile it must be the profile's mode, or absent.
        variables: { $ref: "#/components/schemas/Variables" }

    UnattendDraftRenderRequest:
      allOf:
        - $ref: "#/components/schemas/UnattendRenderRequest"
        - type: object
          required: [template]
          properties:
            template: { $ref: "#/components/schemas/UnattendTemplateInput" }

    UnattendRenderResult:
      allOf:
        - $ref: "#/components/schemas/ValidationResult"
        - type: object
          required: [content]
          properties:
            content: { type: string, description: The rendered file (secrets as `********`). }
            identityMode:
              allOf: [{ $ref: "#/components/schemas/IdentityMode" }]
              description: The mode rendered (`unattend` templates only).

    # ---------- profiles
    InstallMethod:
      type: string
      enum: [agent, smb]

    ProfileKind:
      type: string
      enum: [windows, linux]
      description: |
        `windows`: WinPE and the agent apply an install image (ADR 0024, 0025).
        `linux`: HTTP(S) Boot clients start the distribution's installer
        through the iPXE chain (ADR 0034).

    ProfileInput:
      type: object
      required: [name, installImageId]
      description: |
        `bootImageId`, `editionIndex`, `installMethod` and `identity` are
        required for `windows` profiles (`422`, `code: required_for_kind`,
        the fields in `errors[]`) and must be absent for `linux` ones, which
        use `kernelArgs` and `linux` instead (`422`, `code: not_for_kind`).
        Other Windows-only fields (`osDriverGroupIds`, `smbTargetId`,
        `osSettings`) are refused on a `linux` profile the same way, and
        `linux` on a `windows` one. A `linux` profile's `unattendTemplateId`
        names an `autoinstall` template (`422 template_format_mismatch`
        otherwise); it and `bootOrderAfterDeploy` are for automatic installs
        (ADR 0035). `kind` can't be changed by a replace (`422`,
        `code: kind_changed`): make a new profile.
      properties:
        name: { type: string }
        description: { type: string }
        kind:
          allOf: [{ $ref: "#/components/schemas/ProfileKind" }]
          default: windows
        bootImageId: { type: string, description: Windows profiles. }
        installImageId:
          type: string
          description: |
            A ready image of the profile's kind: a Windows image, or a
            deployable Linux image (`details.deployable`).
        editionIndex: { type: integer, minimum: 1, description: Windows profiles. }
        kernelArgs:
          type: string
          maxLength: 1024
          description: |
            Linux profiles: arguments added to the generated kernel command line
            (ADR 0034), e.g. `console=ttyS0,115200`. No newlines or `"`.
        linux: { $ref: "#/components/schemas/LinuxSettings" }
        osDriverGroupIds:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Drivers injected into the installed OS (separate from boot image drivers).
        unattendTemplateId:
          type: string
          nullable: true
          description: |
            Null uses the kind's built-in template. `builtin` (Windows) and
            `builtin-autoinstall` (Linux) mean the same and are stored as null.
            Windows: an `unattend` template whose `identityModes` include the
            profile's mode. Linux: an `autoinstall` template.
        variables:
          allOf:
            - $ref: "#/components/schemas/Variables"
          description: "Precedence: template `variableDefaults` < profile `variables` < client `variables`."
        installMethod: { $ref: "#/components/schemas/InstallMethod" }
        smbTargetId:
          type: string
          nullable: true
          description: Required when `installMethod` is `smb`.
        identity: { $ref: "#/components/schemas/Identity" }
        osSettings: { $ref: "#/components/schemas/OsSettings" }
        bootOrderAfterDeploy:
          type: string
          enum: [disk-first, network-first]
          description: |
            UEFI boot order the agent (Windows) or the built-in autoinstall
            template's `late-commands` (Linux, ADR 0035) leave after a successful
            deployment; `disk-first` when not given. (No schema
            default: the request validator would fill it in on Linux
            profiles too, which refuse it.)
            Either way the installed system has a boot entry (bcdboot's, or one the
            agent writes when bcdboot made none for the new system partition).
            `disk-first`: that entry is first, so Setup's reboots and later boots go
            straight to disk; re-test via the firmware's one-time boot menu or by
            arming a deployment and network-booting. `network-first`: every boot shows
            the boot prompt, then falls back to disk after its timeout.

    LinuxSettings:
      type: object
      description: |
        A Linux profile's install (ADR 0035). Absent: `interactive`, as
        before. `automatic` needs `account`, with a password or an SSH key
        (`422`, `code: linux_account_required`); the installer then gets a
        NoCloud seed rendered from the profile's `autoinstall` template.
      properties:
        install:
          type: string
          enum: [automatic, interactive]
          default: automatic
          description: "`interactive`: the installer asks everything, as with the ISO."
        hostnamePattern:
          type: string
          nullable: true
          maxLength: 200
          description: |
            As `osSettings.computerNamePattern` (same fields and functions); the
            result is lowercased and must be a hostname label: 1-63 letters, digits
            or hyphens, no hyphen at either end (`invalid_hostname` when arming).
            Null: `linux-` and the MAC's last 6 hex digits.
        account:
          type: object
          required: [username]
          properties:
            username:
              type: string
              pattern: "^[a-z_][a-z0-9_-]{0,31}$"
              description: Not a system account name (`root`, `daemon`, …; `reserved_account_name`).
            realName: { type: string, maxLength: 200 }
            passwordSecretId:
              type: string
              nullable: true
              description: Secret of kind `password`. It reaches the installer only as a SHA-512 crypt hash, over plain HTTP.
            sshAuthorizedKeys:
              type: array
              maxItems: 50
              items: { type: string, maxLength: 16384 }
              description: OpenSSH public keys, one per entry; also installs the OpenSSH server.
            sshPasswordAuth: { type: boolean, default: false }
        storageLayout:
          type: string
          enum: [lvm, direct]
          default: lvm
          description: Subiquity's layout on the largest disk; everything on it is erased.
        locale: { type: string, default: en_GB.UTF-8 }
        keyboardLayout: { type: string, default: gb, description: "An XKB layout, e.g. `gb`, `us`, `de`." }
        timezone: { type: string, default: Europe/London, description: An IANA time zone. }
        packages:
          type: array
          maxItems: 200
          uniqueItems: true
          items: { type: string, pattern: "^[a-z0-9][a-z0-9+.-]*$" }
          description: Extra packages installed into the target.

    Profile:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - $ref: "#/components/schemas/ProfileInput"

    IdentityMode:
      type: string
      enum: [none, local, ad, entra]

    Identity:
      description: How the finished machine is owned and signed into.
      oneOf:
        - $ref: "#/components/schemas/IdentityNone"
        - $ref: "#/components/schemas/IdentityLocal"
        - $ref: "#/components/schemas/IdentityAd"
        - $ref: "#/components/schemas/IdentityEntra"
      discriminator:
        propertyName: mode
        mapping:
          none: "#/components/schemas/IdentityNone"
          local: "#/components/schemas/IdentityLocal"
          ad: "#/components/schemas/IdentityAd"
          entra: "#/components/schemas/IdentityEntra"

    IdentityNone:
      type: object
      required: [mode]
      description: No accounts are created; OOBE stays interactive for the end user.
      properties:
        mode: { type: string, enum: [none] }
        skipEula: { type: boolean, default: true }

    IdentityLocal:
      type: object
      required: [mode, accounts]
      properties:
        mode: { type: string, enum: [local] }
        accounts:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, group, passwordSecretId]
            properties:
              name: { type: string, maxLength: 20 }
              displayName: { type: string }
              group: { type: string, enum: [Administrators, Users] }
              passwordSecretId: { type: string, description: Secret of kind `password`. }
        autoLogon:
          type: object
          nullable: true
          properties:
            account: { type: string, description: "Must match one of `accounts[].name`." }
            count: { type: integer, minimum: 1, maximum: 10, default: 1 }
        hideOobe: { type: boolean, default: true }

    IdentityAd:
      type: object
      required: [mode, joinMethod]
      properties:
        mode: { type: string, enum: [ad] }
        joinMethod:
          type: string
          enum: [odj, credentials]
          description: |
            `odj` (recommended): offline domain join; each client needs an ODJ blob
            in `secretRefs.odjBlob` (from `djoin /provision`), which Setup applies from
            the unattend file (`UnattendedJoin/Identification/Provisioning/AccountData`).
            No credentials reach the client and no DC is needed during Setup. `credentials`: online join during specialize; needs
            line-of-sight to a DC and puts the join credential on the machine
            until cleanup.
        domain: { type: string, description: Required for `credentials`. }
        organizationalUnit: { type: string, nullable: true, description: "Distinguished name, e.g. OU=Labs,DC=corp,DC=example" }
        joinCredentialSecretId:
          type: string
          nullable: true
          description: Secret of kind `domain-credential`. Required for `credentials`.
        localAdmin:
          type: object
          nullable: true
          description: Optional break-glass local administrator.
          properties:
            name: { type: string, maxLength: 20 }
            passwordSecretId: { type: string }

    IdentityEntra:
      type: object
      required: [mode, method]
      properties:
        mode: { type: string, enum: [entra] }
        method:
          type: string
          enum: [autopilot-registered, autopilot-json, provisioning-package]
          description: |
            `autopilot-registered`: device already registered in Intune; nothing is
            injected, OOBE hands over to Autopilot once online.
            `autopilot-json`: agent writes the referenced AutopilotConfigurationFile.json
            into Windows/Provisioning/Autopilot of the applied image.
            `provisioning-package`: agent applies the referenced bulk-enrolment
            .ppkg offline with DISM.
        fileSecretId:
          type: string
          nullable: true
          description: Secret of kind `autopilot-json` or `provisioning-package`, matching `method`.

    OsSettings:
      type: object
      properties:
        computerNamePattern:
          type: string
          nullable: true
          description: |
            Go template for the computer name, e.g. `LAB-{{ .Client.Serial | last 6 }}`.
            Fields: `.Client.Serial`, `.Client.MAC`, `.Client.SMBIOSUUID`,
            `.Client.Hostname`, `.Variables` (profile, then client, values). A serial
            the firmware never set (empty, filler such as `Undefined` or
            `To Be Filled By O.E.M.`, or one character repeated) is replaced by the
            MAC without colons, e.g. `00155dc87909`; check-in doesn't store such
            serials. Functions:
            `first n`, `last n`, `upper`, `lower`. Rendered names must be 1-15
            characters, letters/digits/hyphens, not all digits, no hyphen at either end; violations refuse the
            deployment when it is armed or started. Null lets Windows generate a name.
            Ignored with `ad`/`odj` (the blob names the computer).
        uiLanguage: { type: string, default: en-GB }
        systemLocale: { type: string, default: en-GB }
        userLocale: { type: string, default: en-GB }
        inputLocale: { type: string, default: "0809:00000809", description: "Keyboard layout, e.g. 0809:00000809 (UK)." }
        timeZone: { type: string, default: GMT Standard Time, description: Windows time zone ID. }
        productKeySecretId:
          type: string
          nullable: true
          description: Secret of kind `product-key`. Null uses the edition's default/KMS behaviour.

    # ---------- secrets
    SecretKind:
      type: string
      enum: [password, product-key, domain-credential, share-credential, odj-blob, autopilot-json, provisioning-package]
      description: |
        `share-credential`: a username and password for an SMB share (backup
        destination, SMB targets); the username is the secret's `hint`.

    SecretValue:
      type: object
      description: Exactly one of `value`, `credential` or `uploadId`, depending on kind.
      properties:
        value:
          type: string
          writeOnly: true
          description: For `password` and `product-key`.
        credential:
          type: object
          writeOnly: true
          description: For `domain-credential` and `share-credential`.
          required: [username, password]
          properties:
            username: { type: string, description: "e.g. CORP\\svc-join or svc-join@corp.example" }
            password: { type: string }
        uploadId:
          type: string
          description: For `odj-blob`, `autopilot-json` and `provisioning-package`.

    SecretInput:
      allOf:
        - type: object
          required: [name, kind]
          properties:
            name: { type: string }
            description: { type: string }
            kind: { $ref: "#/components/schemas/SecretKind" }
        - $ref: "#/components/schemas/SecretValue"

    Secret:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [name, kind, valueUpdatedAt]
          properties:
            name: { type: string }
            description: { type: string }
            kind: { $ref: "#/components/schemas/SecretKind" }
            valueUpdatedAt: { type: string, format: date-time }
            hint:
              type: string
              nullable: true
              description: Non-sensitive hint, e.g. the username of a domain credential or a file name.

    # ---------- clients
    ClientInput:
      type: object
      required: [mac]
      properties:
        mac: { $ref: "#/components/schemas/MacAddress" }
        smbiosUuid: { type: string, nullable: true, format: uuid }
        serial: { type: string, nullable: true }
        hostname: { type: string, nullable: true }
        profileId:
          type: string
          nullable: true
          description: The profile armed deployments use when `POST /deployments` names none, and the boot prompt preselects.
        variables: { $ref: "#/components/schemas/Variables" }
        reservedIp:
          type: string
          nullable: true
          format: ipv4
          description: Fixed address on interfaces running `full` DHCP.
        secretRefs:
          type: object
          description: |
            Per-machine secrets, keyed by purpose. Currently `odjBlob` (used when the
            profile's identity is `ad` with `joinMethod: odj`).
          properties:
            odjBlob: { type: string, nullable: true, description: "Secret id of kind `odj-blob` (from `djoin /provision`)." }

    Client:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - $ref: "#/components/schemas/ClientInput"
        - type: object
          properties:
            lastSeenAt: { type: string, nullable: true, format: date-time }
            lastIp: { type: string, nullable: true }
            lastArch: { nullable: true, type: string, allOf: [{ $ref: "#/components/schemas/ClientArch" }] }
            source: { readOnly: true, type: string, allOf: [{ $ref: "#/components/schemas/ClientSource" }] }

    ClientSource:
      type: string
      enum: [manual, discovered]
      description: |
        `manual`: created through the API. `discovered`: created automatically the
        first time the machine network-booted (DHCP) or checked in (agent). Both
        boot the same way; see ADR 0013.

    # ---------- deployments
    DeploymentStatus:
      type: string
      enum: [pending, running, succeeded, failed, cancelled]
      description: |
        `pending`: armed through the API; runs on the client's next network boot.
        `running`: the agent checked in (armed) or started it from the boot prompt.
        Only `pending` deployments are armed, so a machine that reboots mid-deployment
        or after it gets the boot prompt, not a re-image.
        `failed` messages start with a reason: `restarted` (the client checked in
        again), `timeout` (no agent request for `Settings.deployments.inactivityMinutes`),
        `expired` (armed but not picked up within `armedExpiryHours`), `superseded`,
        `plan`, or the agent's own error.

    DeploymentStage:
      type: string
      enum: [checked-in, partitioning, applying-image, injecting-drivers, configuring, finalizing, rebooting]

    Deployment:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [clientId, profileId, status]
          properties:
            clientId: { type: string }
            profileId: { type: string }
            origin:
              type: string
              enum: [scheduled, boot-prompt]
              readOnly: true
              description: "`scheduled`: armed through `POST /deployments`. `boot-prompt`: started at the machine."
            profileSnapshot: { $ref: "#/components/schemas/ProfileInput" }
            computerName:
              type: string
              nullable: true
              readOnly: true
              description: Rendered from `osSettings.computerNamePattern`; null lets Windows (or an ODJ blob) choose.
            unattendTemplate:
              type: object
              readOnly: true
              required: [id, name, builtIn]
              description: |
                The unattend template copied when the deployment was created (ADR 0027);
                later edits to the template don't change it.
              properties:
                id: { type: string }
                name: { type: string }
                builtIn: { type: boolean }
                etag: { type: string, nullable: true, description: The template's etag when copied; null for the built-in. }
            variables:
              allOf:
                - $ref: "#/components/schemas/Variables"
              readOnly: true
              description: The merged variables (template defaults < profile < client) at creation.
            status: { $ref: "#/components/schemas/DeploymentStatus" }
            stage: { $ref: "#/components/schemas/DeploymentStage" }
            percent: { type: integer, minimum: 0, maximum: 100 }
            startedAt: { type: string, nullable: true, format: date-time }
            finishedAt: { type: string, nullable: true, format: date-time }
            message: { type: string }

    LogEntry:
      type: object
      required: [at, level, message]
      properties:
        at: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error] }
        message: { type: string, maxLength: 8192 }
        source: { type: string }

    # ---------- jobs
    # ---------- uploads
    Upload:
      type: object
      description: A tus upload (ADR 0017).
      required: [id, length, offset, status, imported, inUse, createdAt, updatedAt]
      properties:
        id: { type: string }
        filename: { type: string, nullable: true, description: From `Upload-Metadata`. }
        filetype: { type: string, nullable: true, description: From `Upload-Metadata`. }
        length: { type: integer, format: int64 }
        offset: { type: integer, format: int64, description: Bytes received. }
        status: { type: string, enum: [receiving, complete] }
        sha256: { type: string, nullable: true, description: Set once complete. }
        imported:
          type: boolean
          description: An import from this upload succeeded, so it is kept until deleted.
        inUse: { type: boolean, description: A queued or running import job is using it. }
        lastJobId: { type: string, nullable: true, description: The most recent import job that used it. }
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When it will be deleted. Null when kept until deleted (imported).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UploadPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Upload" } }
        nextCursor: { type: string, nullable: true }

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    JobKind:
      type: string
      enum: [image.import, driverPackage.import, bootImage.build, system.backup]

    Job:
      type: object
      description: |
        Background work (ADR 0016). Jobs queue and run in order: boot image builds
        one at a time, imports two at a time, backups one at a time on their own
        lane (ADR 0020). A job that was running when the
        server stopped fails with `interrupted`; it is not resumed.
      required: [id, kind, status, createdAt, percent, cancelRequested]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/JobKind" }
        status: { $ref: "#/components/schemas/JobStatus" }
        resourceId:
          type: string
          nullable: true
          description: |
            The image, driver package or boot image the job works on. An import that
            finds an identical existing item finishes with this set to that item.
        cancelRequested: { type: boolean, readOnly: true, description: "Cancel was requested while running; the job stops shortly." }
        percent: { type: integer, minimum: 0, maximum: 100 }
        message: { type: string }
        error:
          nullable: true
          type: object
          allOf: [{ $ref: "#/components/schemas/Problem" }]
          description: |
            Why the job failed. Codes include `insufficient_storage` (the content store
            ran short of space), `interrupted` (the server stopped while it ran),
            `unsupported_media` and `invalid_media` (image import),
            `unsupported_archive`, `invalid_archive` and `no_drivers` (driver import),
            and `internal_error`. For imports, `detail` also says until when the upload is
            kept for a retry.
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, nullable: true, format: date-time }
        finishedAt: { type: string, nullable: true, format: date-time }

    # ---------- smb
    SmbTargetInput:
      type: object
      required: [name, uncPath, localPath]
      properties:
        name: { type: string }
        uncPath: { type: string, description: 'As seen by clients, e.g. \\deploy01\images' }
        localPath: { type: string, description: Where this server writes the share's content. }
        credentialSecretId:
          type: string
          nullable: true
          description: Secret of kind `share-credential` clients use to connect (ADR 0021). Null for none.

    SmbTarget:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [name, uncPath, localPath]
          properties:
            name: { type: string }
            uncPath: { type: string }
            localPath: { type: string }
            credentialSecretId: { type: string, nullable: true }

    # ---------- settings
    BindFailure:
      type: object
      required: [interface, protocol, port, message]
      properties:
        interface: { type: string }
        protocol: { type: string, enum: [udp, tcp] }
        port: { type: integer }
        message: { type: string }
        ownerProcess:
          type: string
          nullable: true
          description: |
            Process holding the port, when the OS can tell us (ADR 0030): name and
            PID, e.g. `dnsmasq (pid 812)` or `svchost.exe (pid 4120)`. From
            `/proc` on Linux (processes of other accounts need `CAP_SYS_PTRACE`
            and are otherwise left out) and the TCP/UDP owner tables on Windows.
            Null when it can't be found.

    ClientArch:
      type: string
      description: |
        Derived from DHCP option 93. `uefi-x64` = 7/9, `uefi-x64-http` = 16,
        `uefi-arm64` = 11, `uefi-arm64-http` = 19, `bios` = 0.
      enum: [bios, uefi-x64, uefi-x64-http, uefi-arm64, uefi-arm64-http]

    Settings:
      type: object
      required: [admin, interfaces]
      properties:
        etag: { type: string, readOnly: true }
        admin:
          type: object
          description: |
            Admin API + web UI listener. Always HTTPS; a self-signed certificate is
            generated on first run. Bind it to a management address so machines on
            the deployment network cannot reach the admin API.
          required: [bindAddress, port]
          properties:
            bindAddress: { type: string, description: "IP to listen on; `0.0.0.0` for all (not recommended).", default: 127.0.0.1 }
            port: { type: integer, default: 8443 }
            certificatePem: { type: string, nullable: true, description: Null keeps the generated certificate. }
            privateKeyPem: { type: string, nullable: true, writeOnly: true }
            certificateInfo:
              readOnly: true
              allOf:
                - $ref: "#/components/schemas/CertificateInfo"
              description: The certificate the admin listener serves now (generated or custom).
        interfaces:
          type: array
          description: Deployment-network interfaces. Each runs its own DHCP mode and content services.
          items: { $ref: "#/components/schemas/InterfaceSettings" }
        tftp:
          type: object
          description: |
            Server-side TFTP limits, applied to every client (firmware PXE, Boot
            Manager). Negotiated options are capped to these, which protects clients
            from a BCD that asks for more than the network can carry. The defaults
            boot Hyper-V and a physical Intel I210 machine (2026-11-18); see the
            Phase 1 findings, "Chosen defaults" and "I210".
          properties:
            maxBlockSize:
              type: integer
              minimum: 512
              maximum: 65464
              default: 8192
              description: 16384 with a window of 16 lost IP fragments and failed to boot on Hyper-V; 8192/8 never lost a packet.
            maxWindowSize:
              type: integer
              minimum: 1
              maximum: 64
              default: 8
              description: Blocks sent before waiting for an ACK.
            timeoutSeconds:
              type: integer
              minimum: 1
              maximum: 60
              default: 1
              description: |
                Retransmit timeout when the client doesn't negotiate `timeout`. Boot
                Manager never ACKs early to request a resend, so each lost block costs a
                full timeout; a transfer is abandoned after 5 consecutive timeouts.
        contentHttps:
          type: object
          description: |
            TLS for the content listener on interfaces with `services.https` enabled
            (ADR 0028). The server's certificate is issued from an internal CA,
            created the first time an interface enables HTTPS (download it via
            `/settings/content-ca`). The CA's key is sealed with the secrets key
            (ADR 0021): a restore without `netdeployd key export` creates a new CA,
            which makes boot images with `https://` server URLs `stale`.
          properties:
            certificatePem:
              type: string
              nullable: true
              description: |
                A custom certificate is not supported yet: a non-null value is refused
                with `422` (`invalid_settings`, an error on this field). Null uses the
                internal CA.
            privateKeyPem: { type: string, nullable: true, writeOnly: true, description: As `certificatePem`. }
            ca:
              type: object
              readOnly: true
              nullable: true
              allOf:
                - $ref: "#/components/schemas/CertificateInfo"
              description: The internal content CA (RSA-3072, ten years); null until created.
            certificate:
              type: object
              readOnly: true
              nullable: true
              allOf:
                - $ref: "#/components/schemas/CertificateInfo"
              description: |
                The certificate the HTTPS content listeners serve now: RSA-2048, issued
                from the CA, kept only in memory and reissued when its names change
                (every HTTPS interface's address and `advertisedAddress`, this host's
                name, and each host named in a boot image's `https://` server URLs).
                Its `notBefore` is the CA's, so agents with a clock behind the CA's
                creation still accept it. Null while no interface serves HTTPS.
        bootPrompt:
          type: object
          description: |
            What a network-booted machine shows when no deployment is armed for it
            (ADR 0013). Every client that passes the architecture and interface MAC
            filters boots WinPE; DHCP does not answer a client until it has a
            profile to offer (its own, or `defaultProfileId`).
          properties:
            password:
              type: string
              nullable: true
              writeOnly: true
              minLength: 8
              description: Stored as an argon2id hash; never returned. Omit or null to keep the current password.
            hasPassword: { type: boolean, readOnly: true }
            requirePassword:
              type: boolean
              default: true
              description: |
                **Debug only.** False shows the profile menu without a password: anyone
                at a machine on a deployment network can re-image it. Raises the
                `boot_prompt_password_disabled` health warning, a UI banner, a startup
                log warning, and a banner on the WinPE screen.
            timeoutSeconds:
              type: integer
              minimum: 5
              maximum: 3600
              default: 30
              description: Prompt countdown; at zero the agent sets UEFI BootNext to the local disk and reboots.
            armedCountdownSeconds:
              type: integer
              minimum: 0
              maximum: 300
              default: 10
              description: Countdown before an armed deployment starts; any key opens the menu instead.
            defaultProfileId:
              type: string
              nullable: true
              description: |
                Preselected in the menu for clients without a profile, and the boot
                image source for them (ADR 0024). Must name an existing profile.
                Null: such clients are not answered.
        deployments:
          type: object
          description: Deployment timeouts (ADR 0026).
          properties:
            armedExpiryHours:
              type: integer
              minimum: 1
              maximum: 720
              default: 72
              description: An armed (`pending`) deployment not picked up within this fails (`expired`).
            inactivityMinutes:
              type: integer
              minimum: 5
              maximum: 1440
              default: 30
              description: A `running` deployment with no agent request for this long fails (`timeout`).
        storage:
          type: object
          description: |
            Content store (ADR 0015). Its location is the `-content` startup flag
            (default `<data>/content`), not a setting.
          properties:
            reserveBytes:
              type: integer
              format: int64
              minimum: 0
              default: 5368709120
              description: |
                Free space the content store never uses (default 5 GiB). Uploads and
                imports that wouldn't leave this much free are refused with `507`;
                running jobs fail before going below it.
            uploadExpiryHours:
              type: integer
              minimum: 1
              maximum: 720
              default: 24
              description: |
                Uploads that were never imported, or whose last import failed, are
                deleted this long after their last activity. Uploads whose import
                succeeded are kept until deleted.
        backup: { $ref: "#/components/schemas/BackupSettings" }
        architectures:
          type: object
          description: Which client architectures are answered at all.
          properties:
            bios: { type: boolean, default: false, description: Windows 11 requires UEFI. }
            uefiX64: { type: boolean, default: true }
            uefiArm64: { type: boolean, default: true }
            httpBoot:
              type: boolean
              default: true
              description: |
                Answer UEFI HTTP Boot (HTTPClient) requests (ADR 0032): the URL of the
                signed iPXE shim on the interface's content listener, `https://` when
                the interface serves HTTPS, else `http://`. The shim loads iPXE,
                which boots the same boot image a PXE client would get, through
                wimboot. Needs firmware that trusts Microsoft's third-party UEFI CA
                (2011 or 2023) and, for HTTPS, the content CA enrolled
                (`/settings/content-ca`). Applies to `uefiX64` and `uefiArm64`
                clients only if those are on too.

    CertificateInfo:
      type: object
      required: [source, subject, dnsNames, ipAddresses, notBefore, notAfter, sha256]
      properties:
        source:
          type: string
          enum: [generated, custom]
          description: |
            `generated`: made by this server. For the admin listener, the self-signed
            certificate made on first run (`admin-cert.pem` in the data directory; valid
            two years, for localhost, 127.0.0.1, ::1 and this host's name); for content
            HTTPS, the internal CA and the certificates it issues. `custom`:
            `admin.certificatePem`.
        subject: { type: string, description: "The subject, e.g. `CN=netdeploy admin`." }
        issuer: { type: string, description: The issuer; the same as `subject` when self-signed. }
        dnsNames: { type: array, items: { type: string } }
        ipAddresses: { type: array, items: { type: string } }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        sha256: { type: string, description: "SHA-256 fingerprint of the certificate (DER), lowercase hex." }

    BackupSettings:
      type: object
      description: |
        Scheduled backups (ADR 0020): the database, admin certificate and the
        stored files they reference; incremental after the first run.
      properties:
        schedule:
          type: object
          description: |
            In the server's local time. A time skipped by a clock change runs at
            the next valid moment; a repeated one runs once. If the server was
            down at a scheduled time, one backup runs as soon as it starts.
          properties:
            frequency:
              type: string
              enum: [disabled, hourly, daily, weekly, monthly]
              default: disabled
            minute: { type: integer, minimum: 0, maximum: 59, default: 0, description: "`hourly`: minutes past the hour." }
            time:
              type: string
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
              default: "02:00"
              description: "`daily`, `weekly`, `monthly`: HH:MM, 24-hour."
            daysOfWeek:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
              default: [sun]
              description: "`weekly`."
            dayOfMonth:
              type: integer
              minimum: 1
              maximum: 31
              default: 1
              description: "`monthly`. Months shorter than this run on their last day, so 31 means the last day of every month."
        retention:
          type: integer
          minimum: 0
          maximum: 1000
          default: 5
          description: Snapshots to keep; older ones and the files only they reference are deleted after each successful backup. 0 keeps all.
        destination:
          type: object
          nullable: true
          description: Where backups go. Null disables backups (including `POST /system/backups`).
          required: [type, path]
          properties:
            type: { type: string, enum: [local, smb] }
            path:
              type: string
              description: |
                `local`: an absolute directory path on this server, not inside the data
                or content directories. `smb`: `\\server\share` with an optional
                subdirectory, e.g. `\\nas01\backups\netdeploy`.
            credentialSecretId:
              type: string
              nullable: true
              description: "`smb` only (required there): a secret of kind `share-credential` (ADR 0021)."

    InterfaceSettings:
      type: object
      required: [name, dhcp, services]
      properties:
        name: { type: string, description: 'OS interface name, e.g. `Ethernet 2` or `enp3s0`.' }
        macPrefixes:
          type: array
          description: |
            Optional allow-list. When non-empty, only clients whose MAC starts with one
            of these prefixes (e.g. an OUI, `00:1b:21`) are answered on this
            interface. Empty answers every PXE client. Applies to DHCP `proxy` and
            `full`; with `off` the external DHCP server decides.
          items:
            type: string
            pattern: "^[0-9a-f]{2}(:[0-9a-f]{2}){0,5}$"
        advertisedAddress:
          type: string
          nullable: true
          format: ipv4
          description: |
            Address clients use to reach this server (matters with several NICs or
            NAT). Null uses the interface's primary IPv4 address. Boot image
            `serverUrls` default from this.
        services:
          type: object
          properties:
            tftp: { type: boolean, default: true }
            http: { type: boolean, default: true }
            httpPort: { type: integer, default: 80 }
            https:
              type: boolean
              default: false
              description: |
                Content and the agent API over HTTPS, with a certificate from the internal
                content CA (ADR 0028). Independent of `http`: plain HTTP is still needed
                for HTTP Boot without TLS and for boot images with `http://` server URLs.
                With HTTPS on, DHCP gives HTTP Boot clients the `https://` URL (ADR 0032).
                Offers the RSA key-exchange GCM suites as well as the defaults, for
                firmware TLS stacks that have nothing else (OVMF).
            httpsPort: { type: integer, default: 443 }
        dhcp:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: ["off", proxy, full]
              default: proxy
              description: |
                `off`: no DHCP; see `externalDhcpGuidance` for what to configure on
                your own server. `proxy`: answers PXE/HTTP boot clients only, never
                assigns addresses. `full`: address pool with persisted leases.
            listenOn67:
              type: boolean
              default: true
              description: |
                `proxy` only. Set false when a real DHCP server on this same host owns
                UDP 67; the proxy then uses 4011 only, so clients only find it if that
                server sends option 60 `PXEClient`. On Linux, don't share 67 with
                another DHCP server even if the bind succeeds: `SO_REUSEPORT` would
                split packets between the two at random.
            pool:
              type: object
              nullable: true
              description: Required for `full`.
              required: [start, end, subnetMask]
              properties:
                start: { type: string, format: ipv4 }
                end: { type: string, format: ipv4 }
                subnetMask: { type: string, format: ipv4 }
                router: { type: string, nullable: true, format: ipv4 }
                dnsServers: { type: array, items: { type: string, format: ipv4 } }
                domainName: { type: string, nullable: true }
                leaseSeconds: { type: integer, minimum: 60, default: 3600 }
                pingCheck: { type: boolean, default: true, description: Ping an address before offering it. }
        externalDhcpGuidance:
          type: array
          readOnly: true
          description: For `off` mode, the options to set on an external DHCP server, per architecture.
          items:
            type: object
            properties:
              arch: { $ref: "#/components/schemas/ClientArch" }
              nextServer: { type: string, description: Option 66 / siaddr. }
              bootFile: { type: string, description: Option 67 (a URL for HTTP boot). }
              vendorClass: { type: string, description: "Option 60 value to return (PXEClient or HTTPClient)." }

    DhcpLease:
      type: object
      required: [mac, ip, interface, expiresAt]
      properties:
        mac: { $ref: "#/components/schemas/MacAddress" }
        ip: { type: string, format: ipv4 }
        interface: { type: string }
        hostname: { type: string, nullable: true }
        arch: { nullable: true, type: string, allOf: [{ $ref: "#/components/schemas/ClientArch" }] }
        clientId: { type: string, nullable: true, description: 'Matching client, if any.' }
        reserved: { type: boolean, description: "The lease's address is its client's `reservedIp`." }
        expiresAt: { type: string, format: date-time }

    # ---------- tokens
    ApiToken:
      type: object
      required: [id, name, createdAt, createdBy]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, description: The username of the account that created it. }
        expiresAt: { type: string, nullable: true, format: date-time }
        lastUsedAt:
          type: string
          nullable: true
          format: date-time
          description: Updated at most once a minute.

    User:
      type: object
      required: [id, username, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        createdAt: { type: string, format: date-time }
        lastSignInAt: { type: string, nullable: true, format: date-time }
        passwordChangedAt: { type: string, nullable: true, format: date-time }

    Username:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
      description: Unique ignoring case.

    UserInput:
      type: object
      required: [username, password]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { type: string, minLength: 8, maxLength: 256 }

    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 256 }

    SetupRequest:
      type: object
      required: [setupCode, username, password]
      properties:
        setupCode: { type: string, maxLength: 64 }
        username: { $ref: "#/components/schemas/Username" }
        password: { type: string, minLength: 8, maxLength: 256 }

    Session:
      type: object
      required: [signedIn, setupRequired]
      properties:
        signedIn: { type: boolean }
        setupRequired: { type: boolean, description: No account exists yet; create one with `POST /auth/setup`. }
        user:
          allOf:
            - $ref: "#/components/schemas/User"
          description: The signed-in account, or the account that created the token.
        via: { type: string, enum: [cookie, token], description: How this request authenticated. }
        expiresAt:
          type: string
          format: date-time
          description: "Cookie sessions: when the session ends at the latest (7 days after sign-in; 8 hours idle ends it sooner)."

    # ---------- agent
    AgentIdentity:
      type: object
      required: [macs]
      properties:
        macs: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MacAddress" } }
        smbiosUuid: { type: string, nullable: true }
        serial: { type: string, nullable: true }
        manufacturer: { type: string, nullable: true }
        model: { type: string, nullable: true }
        agentVersion: { type: string }

    AgentToken:
      type: object
      required: [token, deploymentId, expiresAt]
      properties:
        token: { type: string, description: "`agentAuth` bearer token for this deployment." }
        deploymentId: { type: string }
        expiresAt: { type: string, format: date-time }

    AgentCheckInResult:
      type: object
      required: [state, clientId]
      properties:
        state: { type: string, enum: [armed, locked] }
        clientId: { type: string }
        armed:
          type: object
          nullable: true
          description: Present when `state` is `armed`.
          allOf:
            - $ref: "#/components/schemas/AgentToken"
            - type: object
              required: [profileName, countdownSeconds]
              properties:
                profileName: { type: string }
                countdownSeconds: { type: integer }
        prompt:
          type: object
          nullable: true
          description: Present when `state` is `locked`.
          required: [requirePassword, passwordConfigured, timeoutSeconds]
          properties:
            requirePassword: { type: boolean, description: False in debug mode; show the warning banner. }
            passwordConfigured: { type: boolean, description: False means only armed deployments can run; say so on screen. }
            timeoutSeconds: { type: integer }

    AgentUnlockResult:
      type: object
      required: [sessionToken, expiresAt, profiles]
      properties:
        sessionToken: { type: string, description: "`agentSessionAuth` bearer token; single use." }
        expiresAt: { type: string, format: date-time }
        defaultProfileId:
          type: string
          nullable: true
          description: Preselected entry; the client's profile, else `Settings.bootPrompt.defaultProfileId`.
        profiles:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }

    AgentDeploymentPlan:
      type: object
      required: [deploymentId, installMethod, image, editionIndex, bootOrderAfterDeploy, bootManager]
      properties:
        deploymentId: { type: string }
        installMethod: { $ref: "#/components/schemas/InstallMethod" }
        image:
          type: object
          required: [contentUrl, sha256]
          properties:
            contentUrl: { type: string, description: "URL of install.wim/esd (agent mode): `/agent/files/{sha256}` on the content listener." }
            sha256: { type: string }
            sizeBytes: { type: integer }
        editionIndex: { type: integer }
        unattendUrl:
          type: string
          nullable: true
          description: |
            Rendered with real secret values; only fetchable with this deployment's
            agent token, and only until the deployment finishes.
        unattendDestination:
          type: string
          enum: [panther, setup-argument]
          description: |
            `panther`: agent writes it to `Windows/Panther/unattend.xml` of the applied
            image (agent mode). `setup-argument`: passed to setup.exe via `/unattend` (smb mode).
        identityFiles:
          type: array
          description: Files the agent places or applies after the image is applied.
          items:
            type: object
            required: [kind, contentUrl, sha256]
            properties:
              kind: { type: string, enum: [odj-blob, autopilot-json, provisioning-package] }
              contentUrl: { type: string, description: "Phase 5 (Autopilot, provisioning packages); Phase 4 plans have none. The ODJ blob travels in the unattend file (ADR 0026)." }
              sha256: { type: string, description: SHA-256 of the decrypted file. }
        cleanup:
          type: object
          description: Agent installs a SetupComplete step that removes these after setup.
          properties:
            removeUnattend: { type: boolean, default: true }
        osDrivers:
          type: array
          description: |
            Every file of each enabled INF's folder in the profile's OS driver groups;
            the agent recreates the folders under one directory and adds them with
            `dism /Add-Driver /Recurse`.
          items:
            type: object
            required: [path, contentUrl, sha256]
            properties:
              path: { type: string, description: "Relative path, e.g. `1/e1r68x64.inf`." }
              contentUrl: { type: string }
              sha256: { type: string }
              sizeBytes: { type: integer }
        smb:
          type: object
          nullable: true
          description: Present when `installMethod` is `smb`.
          properties:
            uncPath: { type: string }
            username: { type: string, nullable: true }
            password: { type: string, nullable: true }
            setupPath: { type: string, description: Path to setup.exe relative to the share. }
        disk:
          type: object
          properties:
            layout:
              type: string
              enum: [uefi-gpt-default]
              default: uefi-gpt-default
              description: EFI 260 MB, MSR 16 MB, Windows, recovery 1 GB (ADR 0025).
            targetDiskIndex:
              type: integer
              nullable: true
              description: |
                Null: auto. Ignore USB, SD and MMC disks and disks under 32 GB, and take
                the lowest-numbered of the rest (ADR 0025).
        bootOrderAfterDeploy:
          type: string
          enum: [disk-first, network-first]
          description: From the profile (ADR 0013).
        bootManager:
          type: string
          enum: [windows-pca-2011, windows-uefi-ca-2023]
          description: |
            The boot manager the boot image serves; `windows-uefi-ca-2023` makes the
            agent run `bcdboot /bootex` so the installed OS uses the 2023-signed one.

    AgentProgress:
      type: object
      required: [stage]
      properties:
        stage: { $ref: "#/components/schemas/DeploymentStage" }
        percent: { type: integer, minimum: 0, maximum: 100 }
        message: { type: string, maxLength: 1024 }
