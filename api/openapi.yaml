  /profiles/{profileId}/validate:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      tags: [profiles]
      operationId: validateProfile
      summary: Check a profile is deployable and report problems.
      description: |
        Example findings: boot image not built or stale; `smb` method without an
        `smbTargetId`; wimlib-built boot image containing boot-critical storage
        drivers; `unsigned` drivers in the boot image (error); drivers whose
        `targetOsVersions` exclude the WinPE or install build (warning); only a
        PCA 2011-signed boot manager available (clients that have revoked it will
        refuse to boot); host DISM older than the image build (warning);
        optional components requested without DISM or a matching ADK (error);
        identity mode missing a required secret, or a secret of the wrong kind
        (error); template whose `identityModes` excludes the profile's mode (error);
        computer-name pattern that can exceed 15 characters (warning, checked
        against each client's data at scheduling time); `ad`/`odj` profile assigned
        to clients without an ODJ blob (warning, listed per client); boot image
        `tftp` values above the `Settings.tftp` caps (warning,
        `tftp_capped_by_server`: the server will negotiate the caps instead).
      responses:
        "200":
          description: Validation result (always 200; check `ok`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- clients
  /clients:
    get:
      tags: [clients]
      operationId: listClients
      summary: List available clients.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: mac, in: query, schema: { $ref: "#/components/schemas/MacAddress" } }
        - { name: profileId, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { $ref: "#/components/schemas/ClientSource" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [clients]
      operationId: createClient
      summary: Create a new client.
      description: |
        Creates a `manual` client. `409` (`code: mac_taken`) if the MAC is already
        registered, `409` (`code: reserved_ip_taken`) if another client has the
        `reservedIp`. `422` (`code: invalid_client`, one `errors[]` entry per field)
        for a malformed `mac` or `reservedIp`, or a non-null `profileId` (until
        profiles exist, Phase 4) or `secretRefs.odjBlob` (until secrets exist,
        Phase 5).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /clients/{clientId}:
    parameters:
      - $ref: "#/components/parameters/ClientId"
    get:
      tags: [clients]
      operationId: getClient
      summary: Get details of a specific client.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [clients]
      operationId: replaceClient
      summary: Replace a specific client.
      description: |
        `If-Match` with the client's `etag`; `412` if it changed. Network boots
        update `lastSeenAt`, `lastIp` and `lastArch` without changing the etag.
        Same `409` and `422` cases as `POST /clients`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [clients]
      operationId: deleteClient
      summary: Delete a specific client.
      description: |
        Also deletes the client's deployment history. `409`
        (`code: deployment_active`) while it has a `pending` or `running`
        deployment; cancel that first.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- deployments
  /deployments:
    get:
      tags: [deployments]
      operationId: listDeployments
      summary: List deployments.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: clientId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DeploymentStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentPage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [deployments]
      operationId: scheduleDeployment
      summary: Arm a client for deployment on its next network boot.
      description: |
        An armed (`pending`) deployment runs on the client's next network boot without
        the boot prompt password: the agent shows a short countdown, and any key opens
        the profile menu instead. The deployment is consumed at agent check-in
        (`pending` → `running`), so later boots fall back to the prompt and then
        the local disk. This is how a known client is re-tested remotely.

        Snapshots the profile (and the current versions of its secrets) at scheduling
        time so later edits or rotations do not change an in-flight deployment. The
        computer name is rendered and validated here; an invalid name returns `422`
        (`code: invalid_computer_name`). `409` (`code: deployment_active`) if the client already
        has a pending or running deployment.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string }
                profileId:
                  type: string
                  description: Overrides the client's assigned profile for this run.
      responses:
        "201":
          description: Scheduled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /deployments/{deploymentId}:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    get:
      tags: [deployments]
      operationId: getDeployment
      summary: Get details of a specific deployment.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /deployments/{deploymentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/DeploymentId"
    post:
      tags: [deployments]
      operationId: cancelDeployment
      summary: Cancel a specific deployment.
      description: Idempotent; cancelling a finished deployment returns it unchanged.
      responses:
        "200":
          description: Cancelled (or already finished).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /deployments/{deploymentId}/logs:
    parameters:
