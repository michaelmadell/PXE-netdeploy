        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [smb-targets]
      operationId: deleteSmbTarget
      summary: Delete a specific SMB target.
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /smb-targets/{smbTargetId}/test:
    parameters:
      - { name: smbTargetId, in: path, required: true, schema: { type: string } }
    post:
      tags: [smb-targets]
      operationId: testSmbTarget
      summary: Check the server can write to `localPath` and the share is reachable.
      responses:
        "200":
          description: Result (check `ok`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- secrets
  /secrets:
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: List secrets.
      description: Metadata only. Values are never returned by any admin endpoint.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/SecretKind" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretPage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [secrets]
      operationId: createSecret
      summary: Create a new secret.
      description: |
        For file-based kinds (`odj-blob`, `autopilot-json`, `provisioning-package`)
        pass `uploadId` instead of `value`. Values are encrypted at rest (DPAPI on
        Windows, a key file on Linux).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /secrets/{secretId}:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    get:
      tags: [secrets]
      operationId: getSecret
      summary: Get details of a specific secret.
      responses:
        "200":
          description: Metadata only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [secrets]
      operationId: updateSecretMetadata
      summary: Update metadata of a specific secret.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [secrets]
      operationId: deleteSecret
      summary: Delete a specific secret.
      description: "`409` (`code: secret_in_use`) while referenced by a profile, client, SMB target or the backup settings."
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /secrets/{secretId}/value:
    parameters:
      - $ref: "#/components/parameters/SecretId"
    put:
      tags: [secrets]
      operationId: replaceSecretValue
      summary: Rotate the value. Write-only; there is no GET for this path.
      description: Deployments scheduled before the rotation keep the value they were scheduled with.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretValue" }
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- settings
  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Get the current settings.
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      tags: [settings]
      operationId: replaceSettings
      summary: Replace the current settings.
      description: |
        Applied atomically: the new configuration is validated and every listener
        is bound before the old one is released; a listener whose address doesn't
        change keeps its socket. If anything fails (unknown interface, port in
        use, invalid pool), the running configuration is kept and `422` is
        returned with one `errors[]` entry per failure, e.g.
        `{ field: "interfaces[0].dhcp", message: "UDP 67 in use by svchost.exe (SharedAccess)" }`.
        Schema violations return `400` with the same `errors[]` shape.
        `backup.destination` is checked for form only (path shape, an existing
        `share-credential` secret), never by connecting: `422` on a bad one.

        Read-only fields (`etag`, `hasPassword`, `externalDhcpGuidance`) are
        ignored. Write-only fields keep their current value when omitted or null.
        Moving the admin listener binds the new address first and closes the old
        one a few seconds after this response; the `-admin-addr` flag overrides
        `admin` if you lock yourself out.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Applied.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /settings/content-ca:
    get:
      tags: [settings]
      operationId: getContentCaCertificate
      summary: CA certificate for the HTTPS content listener (to enrol in firmware for HTTPS boot).
      description: "Content HTTPS is planned for Phase 6; until then this always returns `404` (`code: content_https_not_available`)."
      responses:
        "200":
          description: "PEM, or DER with `Accept: application/pkix-cert`."
          content:
            application/x-pem-file:
              schema: { type: string }
            application/pkix-cert:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problem" }
        "404":
          description: HTTPS content is not configured (always, until Phase 6).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ---------------------------------------------------------------- dhcp
  /dhcp/leases:
    get:
      tags: [dhcp]
      operationId: listDhcpLeases
      summary: Current leases on interfaces running `full` DHCP.
      description: |
        Bound, unexpired leases, ordered by interface then address. Proxy mode
        never assigns addresses, so it has none; addresses declined after a
        conflict (DHCPDECLINE or a ping answer) are not listed.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: interface, in: query, schema: { type: string } }
        - { name: mac, in: query, schema: { $ref: "#/components/schemas/MacAddress" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DhcpLeasePage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- tokens
  /tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: List API tokens.
      responses:
        "200":
          description: OK (secrets never returned after creation).
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create a new API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                expiresAt: { type: string, nullable: true, format: date-time }
      responses:
        "201":
          description: Created. `secret` is shown exactly once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiToken"
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /tokens/{tokenId}:
    parameters:
      - { name: tokenId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke a specific API token.
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- agent
  /agent/check-in:
    post:
      tags: [agent]
      operationId: agentCheckIn
      security: []
      summary: First call from WinPE. Reports hardware identity; returns whether the machine is armed.
      description: |
        Unauthenticated by necessity (WinPE has no prior secret). Creates the client
        (`source: discovered`) if no client has any of the MACs, which covers
        interfaces in DHCP `off` mode; otherwise updates its hardware details.

        * `state: armed`: a client MAC has a `pending` deployment, and the request's
          source IP matches the address recently leased/offered to that MAC (when this
          server saw the DHCP exchange). The deployment moves to `running` and its
          agent token is returned. The agent shows `armed.countdownSeconds`, then
          deploys; any key opens the profile menu via `/agent/unlock` instead.
        * `state: locked`: no armed deployment. The agent shows the boot prompt
          described by `prompt`, and boots the local disk when it times out.

        Threat model: spoofing a MAC on the deployment LAN can claim an *armed*
        deployment's config, so treat unattend secrets accordingly. Starting a
        deployment on an un-armed machine requires the boot prompt password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentIdentity" }
      responses:
        "200":
          description: Armed or locked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCheckInResult" }
        "400": { $ref: "#/components/responses/Problem" }

  /agent/unlock:
    post:
      tags: [agent]
      operationId: agentUnlock
      security: []
      summary: Exchange the boot prompt password for a short session that can start a deployment.
      description: |
        `password` is required unless `Settings.bootPrompt.requirePassword` is false
        (debug mode), in which case it is ignored. Failed attempts are rate-limited
        per MAC and per source IP; `429` (`code: too_many_attempts`) carries
        `Retry-After`. `401` (`code: invalid_password`) for a wrong password, `403`
        (`code: password_not_configured`) when a password is required but none is set
        (only armed deployments can run then). `404` (`code: unknown_client`) if the
        client id was not returned by a check-in from this source IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string, description: From `/agent/check-in`. }
                password: { type: string, nullable: true, writeOnly: true }
      responses:
        "200":
          description: Unlocked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUnlockResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /agent/deployments:
    post:
      tags: [agent]
      operationId: agentStartDeployment
      summary: Start a deployment from the boot prompt menu.
      security:
        - agentSessionAuth: []
      description: |
        Schedules and immediately starts (`running`) a deployment of `profileId` for
        the session's client, snapshotting the profile exactly as
        `POST /deployments` does, and returns its agent token. The deployment runs
        in the WinPE that is already booted, even if the profile names a different
        boot image. A `running` deployment for the same client (an agent that
        crashed or was rebooted) is marked `failed` (`code: superseded`) first; a
        `pending` one is cancelled. The session token is single-use.
        `404` (`code: profile_not_found`); `422` (`code: invalid_computer_name`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId: { type: string }
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentToken" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /agent/deployment:
    get:
      tags: [agent]
      operationId: agentGetDeployment
      security:
        - agentAuth: []
      summary: Everything the agent needs to perform the install.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDeploymentPlan" }
        "401": { $ref: "#/components/responses/Problem" }

  /agent/progress:
    post:
      tags: [agent]
      operationId: agentReportProgress
      summary: Report progress of the current deployment stage.
      security:
        - agentAuth: []
      description: |
        Stages move forward only; a report for an earlier stage than the current one
        is ignored (safe under retries).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProgress" }
      responses:
        "204": { description: Recorded. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /agent/logs:
    post:
      tags: [agent]
      operationId: agentUploadLogs
      summary: Upload logs for the current deployment stage.
      security:
        - agentAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/LogEntry" } }
      responses:
        "204": { description: Recorded. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /agent/complete:
    post:
      tags: [agent]
      operationId: agentComplete
      summary: Complete the current deployment with the final result.
      security:
        - agentAuth: []
      description: |
        Final result. Idempotent; the token is revoked afterwards. The agent reports
        the result *before* it applies the profile's `bootOrderAfterDeploy` and
        reboots.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [succeeded, failed] }
                message: { type: string }
      responses:
        "204": { description: Recorded. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Admin API token.
    agentAuth:
      type: http
      scheme: bearer
      description: Short-lived, single-deployment token from `/agent/check-in` (armed) or `/agent/deployments`.
    agentSessionAuth:
      type: http
      scheme: bearer
      description: Short-lived, single-use boot prompt session from `/agent/unlock`.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string }
    ImageId:
      name: imageId
      in: path
      required: true
      schema: { type: string }
    BootImageId:
      name: bootImageId
      in: path
      required: true
      schema: { type: string }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string }
    ClientId:
      name: clientId
      in: path
      required: true
      schema: { type: string }
    SecretId:
      name: secretId
      in: path
      required: true
      schema: { type: string }
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: { type: string }

  responses:
    Problem:
      description: Error (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    JobAccepted:
      description: Accepted; work continues in the background.
      headers:
        Location: { schema: { type: string }, description: URL of the job. }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Job" }

  schemas:
    # ---------- common
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable code, e.g. `image_in_use`, `build_in_progress`.
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    BootImagePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BootImage" } }
        nextCursor: { type: string, nullable: true }

    ClientPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Client" } }
        nextCursor: { type: string, nullable: true }

    DeploymentPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Deployment" } }
        nextCursor: { type: string, nullable: true }

    DhcpLeasePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DhcpLease" } }
        nextCursor: { type: string, nullable: true }

    DriverGroupPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DriverGroup" } }
        nextCursor: { type: string, nullable: true }

    DriverPackagePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DriverPackage" } }
        nextCursor: { type: string, nullable: true }

    ImagePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Image" } }
        nextCursor: { type: string, nullable: true }

    JobPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Job" } }
        nextCursor: { type: string, nullable: true }

    LogEntryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LogEntry" } }
        nextCursor: { type: string, nullable: true }

    ProfilePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Profile" } }
        nextCursor: { type: string, nullable: true }

    SecretPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Secret" } }
        nextCursor: { type: string, nullable: true }

    UnattendTemplatePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/UnattendTemplate" } }
        nextCursor: { type: string, nullable: true }

    Meta:
      type: object
      required: [id, etag, createdAt, updatedAt]
      properties:
        id: { type: string, readOnly: true }
        etag: { type: string, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }

    Variables:
      type: object
      description: Template variables (string values only, to keep rendering predictable).
      additionalProperties: { type: string }

    MacAddress:
      type: string
      pattern: "^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$"
      description: |
        Six hex pairs separated by `:` or `-`, any case. The server normalises
        input; responses are always lower-case and colon-separated.

    Architecture:
      type: string
      enum: [x64, arm64]

    ValidationResult:
      type: object
      required: [ok, findings]
      properties:
        ok: { type: boolean }
        findings:
          type: array
          items:
            type: object
            required: [severity, code, message]
            properties:
              severity: { type: string, enum: [error, warning, info] }
              code: { type: string }
              message: { type: string }

    # ---------- system
    Health:
      type: object
      required: [status, services]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        services:
          type: object
          description: |
            Keyed by service: `store` (the database), `storage` (the content
            store), `admin`, `dhcp`, `tftp`, `content`. `storage`
            is `error` when the content store is unusable or a stored file is
            missing or truncated (ADR 0015); `detail` says which.
          additionalProperties: { $ref: "#/components/schemas/ServiceHealth" }
        storage: { $ref: "#/components/schemas/StorageHealth" }
        backup: { $ref: "#/components/schemas/BackupHealth" }
        warnings:
          type: array
          description: |
            Configuration the operator should know about; does not change `status`.
            Codes: `boot_prompt_password_disabled` (debug mode: anyone at a machine can
            re-image it), `boot_prompt_no_password` (only armed deployments can run),
            `no_default_profile` (unknown clients are not answered), `storage_low`
            (free space in the content store is below twice `storage.reserveBytes`),
            `backup_failed` (the last backup failed), `backup_overdue` (scheduled
            backups haven't succeeded for two intervals), `secrets_key_not_exported`
            (secrets exist but the key was never exported with `netdeployd key
            export`; without it they can't be restored on other hardware, ADR 0021).
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }

    BackupHealth:
      type: object
      description: Backups (ADR 0020). Absent fields mean "never".
      properties:
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        lastFailureAt: { type: string, format: date-time, nullable: true }
        lastError:
          type: string
          nullable: true
          description: The last failure's detail, if it is newer than the last success.
        nextRunAt:
          type: string
          format: date-time
          nullable: true
          description: Next scheduled run; null when `backup.schedule.frequency` is `disabled` or no destination is set.

    Backup:
      type: object
      description: One snapshot at the destination (ADR 0020).
      required: [id, createdAt, trigger, serverVersion, schemaVersion, blobCount, blobBytes, databaseBytes]
      properties:
        id: { type: string, description: "Snapshot directory name, the UTC start time, e.g. `20261108T020000Z`." }
        createdAt: { type: string, format: date-time }
        trigger: { type: string, enum: [scheduled, manual, offline] }
        serverVersion: { type: string }
        schemaVersion: { type: integer, description: Database schema version; restore needs a server at least this new. }
        blobCount: { type: integer, description: Stored files this snapshot references. }
        blobBytes: { type: integer, format: int64, description: Their total size (shared with other snapshots). }
        databaseBytes: { type: integer, format: int64 }
        secretsKeyFingerprint:
          type: string
          nullable: true
          description: SHA-256 of the secrets key at backup time (ADR 0021); null if there were no secrets.

    StorageHealth:
      type: object
      description: Space on the content store's volume (ADR 0015).
      required: [totalBytes, freeBytes, contentBytes, uploadBytes, reserveBytes]
      properties:
        totalBytes: { type: integer, format: int64, description: Size of the volume. }
        freeBytes: { type: integer, format: int64, description: Free space available to netdeployd. }
        contentBytes: { type: integer, format: int64, description: Total size of the stored files (each counted once). }
        uploadBytes: { type: integer, format: int64, description: "Bytes held by uploads, including imported ones kept until deleted." }
        reserveBytes: { type: integer, format: int64, description: "`storage.reserveBytes`: space imports never use." }

    ServiceHealth:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, disabled, error] }
        detail: { type: string }
        bindFailures:
          type: array
          items: { $ref: "#/components/schemas/BindFailure" }

    Capabilities:
      type: object
      required: [hostOs, builders, version]
      properties:
        version: { type: string }
        hostOs: { type: string, enum: [windows, linux] }
        builders:
          type: array
          items:
            type: object
            required: [name, available]
            properties:
              name: { $ref: "#/components/schemas/BuilderName" }
              available: { type: boolean }
              version:
                type: string
                description: |
                  Tool version (DISM version for `dism`). DISM cannot reliably
                  service images newer than itself; validation compares this with
                  the source image build.
              reason: { type: string, description: "Why unavailable, if not available (e.g. DISM when the server isn't elevated)." }
              path: { type: string, description: "The tool used (wimlib: from `-wimlib` or PATH)." }
        elevated:
          type: boolean
          description: "Windows hosts: whether the server runs elevated (DISM needs it). Always false on Linux."
        agent:
          type: object
          description: The WinPE agent bundled with this server (ADR 0022).
          required: [version, architectures]
          properties:
            version: { type: string }
            architectures:
              type: array
              items: { $ref: "#/components/schemas/Architecture" }
              description: Architectures with a bundled agent binary; empty in a build without agents.
        adk:
          type: object
          description: Windows ADK / WinPE add-on, needed only for optional components.
          properties:
            installed: { type: boolean }
            version: { type: string, nullable: true }
        cabLzx:
          type: object
          description: |
            Whether LZX-compressed CABs (common for Microsoft Update Catalog drivers) can
            be imported: `expand.exe` on Windows, `cabextract` on Linux (ADR 0019).
          required: [available]
          properties:
            available: { type: boolean }
            tool: { type: string, nullable: true }
            reason: { type: string }

    Event:
      type: object
      required: [type, at]
      properties:
        type:
          type: string
          enum: [client.updated, lease.updated, settings.updated, health.updated, job.updated, deployment.updated, bootImage.updated, image.updated, driverPackage.updated]
        at: { type: string, format: date-time }
        resourceId: { type: string }
        data:
          type: object
          description: |
            Depends on `type`:
            * `client.updated`: `{id, mac, change}`, `change` one of `created`,
              `updated`, `deleted`, `seen` (a network boot; at most every 30 s per
              MAC). `resourceId` is the client id.
            * `lease.updated`: `{interface, ip, mac, change}`, `change` one of
              `bound`, `released`, `declined` (full-mode DHCP).
            * `settings.updated`: `{etag}`.
            * `health.updated`: the `Health` object, after listeners change.
            * `job.updated`: `{kind, status, percent, resourceId}` (`resourceId`
              in `data` is the job's resource; the event's `resourceId` is the
              job id). Sent when the status changes and at most twice a second
              for progress.
            * `image.updated`, `driverPackage.updated`: the resource changed
              (created, import finished, edited); `data.change` is `deleted`
              when it was deleted. `resourceId` is the image or package id.
            * `deployment.updated`, `bootImage.updated`: from Phase 4.

    # ---------- images
    ImageKind:
      type: string
      enum: [windows, linux, other]

    SecureBootSigner:
      type: string
      enum: [windows-pca-2011, windows-uefi-ca-2023, uefi-ca-2011, uefi-ca-2023, unsigned, unknown]

    ImageImport:
      type: object
      required: [uploadId, name]
      properties:
        uploadId: { type: string }
        name: { type: string }
        retainIso:
          type: boolean
          default: false
          description: |
            Keep the original ISO alongside the extracted files. Only needed for
            features that serve the whole ISO (e.g. future UEFI HTTP Boot of ISOs).
            The ISO is hardlinked from the upload where the volume allows, so it
            costs no extra space while the upload is also kept.

    ImageUpdate:
      type: object
      properties:
        name: { type: string }
        notes: { type: string }

    Image:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [name, kind, status, retainIso]
          properties:
            name: { type: string }
            notes: { type: string }
            kind:
              type: string
              nullable: true
              allOf: [{ $ref: "#/components/schemas/ImageKind" }]
              description: Null while importing.
            status: { type: string, enum: [importing, ready, failed] }
            sourceFilename:
              type: string
              nullable: true
              description: The uploaded ISO's file name (from the upload's metadata).
            volumeLabel:
              type: string
              nullable: true
              description: The ISO's volume label, e.g. `CPBA_X64FRE_EN-GB_DV9`.
            uploadId:
              type: string
              nullable: true
              description: The upload it was imported from; null once that upload is deleted.
            warnings:
              type: array
              items: { type: string }
              description: Things the import couldn't do that don't make it fail (e.g. a `boot.wim` it couldn't read).
            error:
              nullable: true
              type: object
              allOf:
                - $ref: "#/components/schemas/Problem"
              description: Why the import failed (when `status` is `failed`).
            sizeBytes: { type: integer, format: int64, description: Size of the ISO. }
            sha256: { type: string, description: SHA-256 of the ISO. }
            retainIso: { type: boolean }
            details:
              description: Kind-specific metadata. Absent until the import finishes.
              oneOf:
                - $ref: "#/components/schemas/WindowsImageDetails"
                - $ref: "#/components/schemas/OtherImageDetails"
              discriminator:
                propertyName: kind
                mapping:
                  windows: "#/components/schemas/WindowsImageDetails"
                  other: "#/components/schemas/OtherImageDetails"
                  # linux: added in the Linux phase

    WindowsImageDetails:
      type: object
      required: [kind, architecture, installImageFormat, editions, bootManagers, bootImageIndexes]
      properties:
        kind: { type: string, enum: [windows] }
        architecture: { $ref: "#/components/schemas/Architecture" }
        installImageFormat:
          type: string
          enum: [wim, esd, swm]
          description: "`swm` = split WIM (install.swm, install2.swm, ...)."
        editions:
          type: array
          items: { $ref: "#/components/schemas/WindowsEdition" }
        bootImageIndexes:
          type: array
          description: Images inside boot.wim (index 1 = WinPE, 2 = Windows Setup on standard media).
          items:
            type: object
            properties:
              index: { type: integer }
              name: { type: string }
        bootManagers:
          type: array
          description: Every boot manager found on the media and inside its WIMs.
          items: { $ref: "#/components/schemas/BootManager" }

    WindowsEdition:
      type: object
      required: [index, name]
      properties:
        index: { type: integer, minimum: 1 }
        name: { type: string, description: "Display name, e.g. Windows 11 Pro." }
        editionId: { type: string, description: "e.g. Professional, Enterprise." }
        build: { type: string, description: "e.g. 26100.1742" }
        architecture: { $ref: "#/components/schemas/Architecture" }
        languages: { type: array, items: { type: string }, description: "e.g. en-GB." }
        defaultLanguage: { type: string }
        sizeBytes: { type: integer, description: Expanded size of this edition. }

    BootManager:
      type: object
      required: [signer, sourcePath, sha256]
      properties:
        signer: { $ref: "#/components/schemas/SecureBootSigner" }
        sourcePath:
          type: string
          description: Where it was found, e.g. `efi/boot/bootx64.efi` or `boot.wim:2/Windows/Boot/EFI_EX/bootmgfw_EX.efi`.
        sha256: { type: string }
        architecture: { $ref: "#/components/schemas/Architecture" }

    OtherImageDetails:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [other] }
        bootFiles:
          type: array
          description: EFI binaries found, with signers, for manual boot configuration.
          items: { $ref: "#/components/schemas/BootManager" }

    # ---------- drivers
    DriverRole:
      type: string
      enum: [network, storage, other]
      description: |
        Derived from the INF class: `Net` → network; `SCSIAdapter`, `HDC` → storage;
        everything else → other. Storage drivers are boot-critical.

    DriverSignature:
      type: string
      enum: [whql, vendor, unsigned, unknown]
      description: |
        `whql` = catalog signed by Microsoft (WHQL, attestation or inbox signing);
        `vendor` = catalog signed by the vendor's own certificate;
        `unsigned` = no catalog, no valid signature, or a file the INF installs isn't
        covered by the catalog;
        `unknown` = catalog present but it can't be evaluated here (e.g. an
        unsupported algorithm). `DriverInf.signatureDetail` says why for anything
        but `whql`.
        Boot images reject `unsigned` drivers: x64 WinPE under Secure Boot won't load them.

    DriverInf:
      type: object
      required: [id, path, class, role, enabled, signature, architectures]
      properties:
        id: { type: string, readOnly: true }
        path: { type: string, description: Path of the INF inside the package. }
        class: { type: string, description: "INF class, e.g. Net, SCSIAdapter, HDC." }
        role: { $ref: "#/components/schemas/DriverRole" }
        bootCritical:
          type: boolean
          readOnly: true
          description: "Equals `role == storage`: must be present before the agent runs."
        provider: { type: string }
        version: { type: string }
        driverDate: { type: string, format: date }
        architectures:
          type: array
          items: { $ref: "#/components/schemas/Architecture" }
          description: |
            From the INF's decorations (`NTamd64`, `NTarm64`; undecorated means all).
            Empty when it supports neither x64 nor arm64; such INFs start disabled.
        targetOsVersions:
          type: array
          description: |
            From the INF's [Manufacturer] decorations, e.g. `10.0...22000`
            (Windows 11 21H2+). Empty means no OS version restriction.
          items: { type: string }
        hardwareIds: { type: array, items: { type: string } }
        signature: { $ref: "#/components/schemas/DriverSignature" }
        signer: { type: string, nullable: true, description: Certificate subject of the catalog signer. }
        signatureDetail:
          type: string
          nullable: true
          description: Why the signature isn't `whql`, e.g. `e1r68x64.sys is not in e1r68x64.cat`.
        enabled:
          type: boolean
          default: true
          description: Disabled INFs are skipped when the package is injected.

    DriverPackage:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [name, status, infs]
          properties:
            name: { type: string }
            status: { type: string, enum: [importing, ready, failed] }
            error:
              nullable: true
              type: object
              allOf:
                - $ref: "#/components/schemas/Problem"
            sha256: { type: string, description: SHA-256 of the archive. }
            sizeBytes: { type: integer, format: int64, description: Size of the archive. }
            sourceFilename: { type: string, nullable: true, description: The uploaded archive's file name. }
            uploadId: { type: string, nullable: true, description: The upload it was imported from; null once deleted. }
            warnings: { type: array, items: { type: string } }
            infs:
              type: array
              items: { $ref: "#/components/schemas/DriverInf" }

    DriverPackageUpdate:
      type: object
      properties:
        name: { type: string }
        infs:
          type: array
          description: Only the INFs being changed; unknown INF ids return `400`.
          items:
            type: object
            required: [id, enabled]
            properties:
              id: { type: string }
              enabled: { type: boolean }

    DriverGroupInput:
      type: object
      required: [name, driverPackageIds]
      properties:
        name: { type: string }
        description: { type: string }
        driverPackageIds: { type: array, items: { type: string }, uniqueItems: true }

    DriverGroup:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - $ref: "#/components/schemas/DriverGroupInput"

    # ---------- boot images
    BuilderName:
      type: string
      enum: [dism, wimlib]

    WinPeOptionalComponent:
      type: string
      description: WinPE optional component name (DISM + matching ADK only).
      enum:
        - WinPE-WMI
        - WinPE-NetFx
        - WinPE-Scripting
        - WinPE-PowerShell
        - WinPE-StorageWMI
        - WinPE-DismCmdlets
        - WinPE-SecureStartup
        - WinPE-EnhancedStorage

    BootImageInput:
      type: object
      required: [name, sourceImageId, architecture, serverUrls]
      properties:
        name: { type: string }
        sourceImageId: { type: string, description: A `windows` Image. }
        sourceIndex:
          type: integer
          minimum: 1
          default: 1
          description: |
            Index inside boot.wim. 1 (plain WinPE on standard media) is the default:
            index 2 (Windows Setup) is larger and its Setup program blocks in WDS mode
            (Phase 1 findings). Must be one of the image's `bootImageIndexes`.
        architecture: { $ref: "#/components/schemas/Architecture" }
        driverGroupIds: { type: array, items: { type: string }, uniqueItems: true }
        agentVersion:
          type: string
          description: |
            Defaults to the bundled agent; only the bundled version
            (`Capabilities.agent.version`) is accepted for now.
        serverUrls:
          type: array
          minItems: 1
          items: { type: string, format: uri }
          description: |
            Baked into the image as the agent's config; tried in order. Changing
            the server's address therefore marks images `stale`.
        builder:
          type: string
          enum: [auto, dism, wimlib]
          default: auto
          description: |
            `auto` uses `wimlib` when `wimlib-imagex` is available, else `dism` (the
            server elevated on Windows, DISM not older than the image). `dism` injects
            drivers into WinPE's driver store; with `wimlib` they are staged as files
            and the agent loads them with `drvload` before it looks at disks. WinPE
            runs from a RAM disk, so storage drivers (RAID, VMD) work either way
            (ADR 0022).
        optionalComponents:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/WinPeOptionalComponent" }
          description: |
            Requires the `dism` builder and an ADK matching the image build. Empty by
            default. Not implemented yet: a non-empty list is refused with `422`
            (`code: not_implemented`).
        bootmgr:
          type: string
          enum: [auto, windows-pca-2011, windows-uefi-ca-2023]
          default: auto
          description: |
            Which signed boot manager to serve, chosen from the source image's
            `bootManagers`. `auto` serves the 2023-signed one when the image has it,
            otherwise the 2011-signed one. Fails validation if the requested
            variant isn't present in the source image.
        tftp:
          type: object
          description: |
            Written into the BCD as what Boot Manager *requests* when it downloads
            boot.sdi and boot.wim. The server answers with the lower of this and
            `Settings.tftp`, so the defaults ask generously and the server caps (which
            change without a rebuild) decide. Lower these only for hardware that must
            request less, e.g. 1456 on a network that drops IP fragments. Changing them
            needs a rebuild. Tested 2026-11-05: a BCD asking 16384/16 capped to 8192/8
            boots (Phase 1 findings).
          properties:
            blockSize:
              type: integer
              minimum: 512
              maximum: 16384
              default: 16384
              description: "`ramdisktftpblocksize`."
            windowSize:
              type: integer
              minimum: 1
              maximum: 64
              default: 16
              description: "`ramdisktftpwindowsize`."
        produceHttpBootIso:
          type: boolean
          default: false
          description: |
            Also build a small bootable ISO (bootmgr + BCD + boot.wim) for UEFI HTTP
            Boot, which the firmware loads as a RAM disk. Firmware support varies.
            Not implemented yet (Phase 1 task 9): `true` is refused with `422`
            (`code: not_implemented`).

    BootArtifact:
      type: object
      description: |
        One file of a built boot image's tree, served to the clients that boot it
        (ADR 0006, 0022): `bootmgfw.efi`, `Boot/BCD`, `Boot/boot.sdi`, `Boot/boot.wim`
        and `EFI/Microsoft/Boot/Fonts/*.ttf`.
      required: [kind, path, sha256, sizeBytes]
      properties:
        kind: { type: string, enum: [wim, bcd, bootmgr, sdi, font, http-boot-iso] }
        path: { type: string, description: "Path in the tree, e.g. `Boot/boot.wim`; the TFTP path is `\\` plus this with backslashes." }
        sha256: { type: string }
        sizeBytes: { type: integer }

    BootImage:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - $ref: "#/components/schemas/BootImageInput"
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [draft, building, ready, stale, failed]
              description: |
                `draft`: never built. `building`: a build is queued or running.
                `ready`: built from the current inputs. `stale`: built, but the inputs
                have changed since (`staleReasons`). `failed`: the last build failed.
                Whatever the status, a boot image with `artifacts` keeps serving its
                last good build.
            staleReasons:
              type: array
              readOnly: true
              description: What changed since the last build (only when `stale`).
              items:
                type: string
                enum: [source-image, source-index, architecture, builder, agent, server-urls, bootmgr, tftp, drivers, recipe]
            inputHash:
              type: string
              readOnly: true
              nullable: true
              description: |
                `inputHash` of the build being served (ADR 0022): a hash of every build
                input (recipe version, the source boot.wim, index, architecture, resolved
                builder, agent binary, serverUrls, bootmgr choice, TFTP settings and the
                enabled INFs of the selected driver groups).
            builtWith: { $ref: "#/components/schemas/BuilderName" }
            builtAt: { type: string, nullable: true, format: date-time }
            selectedBootManager:
              nullable: true
              type: object
              allOf:
                - $ref: "#/components/schemas/BootManager"
              description: The boot manager actually used by the last build.
            artifacts:
              type: array
              items: { $ref: "#/components/schemas/BootArtifact" }
            warnings: { type: array, items: { type: string } }
            error:
              nullable: true
              type: object
              allOf:
                - $ref: "#/components/schemas/Problem"
            lastJobId: { type: string, nullable: true }
            sizeBytes:
              type: integer
              readOnly: true
              nullable: true
              description: Total size of the served build's files.

    # ---------- unattend
    UnattendTemplateInput:
      type: object
      required: [name, content, identityModes]
      properties:
        name: { type: string }
        description: { type: string }
        content:
          type: string
          description: |
            Go `text/template` producing autounattend.xml. Available data:
            `.Identity`, `.OsSettings`, `.ComputerName`, `.Client`, `.Deployment`,
            `.Vars`. Every inserted value is XML-escaped automatically; inserting
            raw XML requires the explicit `raw` function.
        identityModes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/IdentityMode" }
          description: Identity modes this template knows how to render.
        variableDefaults: { $ref: "#/components/schemas/Variables" }
        requiredVariables: { type: array, items: { type: string } }

    UnattendTemplate:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - $ref: "#/components/schemas/UnattendTemplateInput"
        - type: object
          required: [builtIn]
          properties:
            builtIn:
              type: boolean
              readOnly: true
              description: Shipped default (one per identity mode). Read-only; clone it to customise.

    # ---------- profiles
    InstallMethod:
      type: string
      enum: [agent, smb]

    ProfileInput:
      type: object
      required: [name, bootImageId, installImageId, editionIndex, installMethod, identity]
      properties:
        name: { type: string }
        description: { type: string }
        bootImageId: { type: string }
        installImageId: { type: string }
        editionIndex: { type: integer, minimum: 1 }
        osDriverGroupIds:
          type: array
          uniqueItems: true
          items: { type: string }
          description: Drivers injected into the installed OS (separate from boot image drivers).
        unattendTemplateId:
          type: string
          nullable: true
          description: Null uses the built-in template for the profile's identity mode.
        variables:
          allOf:
            - $ref: "#/components/schemas/Variables"
          description: "Precedence: template `variableDefaults` < profile `variables` < client `variables`."
        installMethod: { $ref: "#/components/schemas/InstallMethod" }
        smbTargetId:
          type: string
          nullable: true
          description: Required when `installMethod` is `smb`.
        identity: { $ref: "#/components/schemas/Identity" }
        osSettings: { $ref: "#/components/schemas/OsSettings" }
        bootOrderAfterDeploy:
          type: string
          enum: [disk-first, network-first]
          default: disk-first
          description: |
            UEFI boot order the agent leaves after a successful deployment.
            `disk-first` (bcdboot's default): Setup's reboots and later boots go
            straight to disk; re-test via the firmware's one-time boot menu or by
            arming a deployment and network-booting. `network-first`: every boot shows
            the boot prompt, then falls back to disk after its timeout.

    Profile:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - $ref: "#/components/schemas/ProfileInput"

    IdentityMode:
      type: string
      enum: [none, local, ad, entra]

    Identity:
      description: How the finished machine is owned and signed into.
      oneOf:
        - $ref: "#/components/schemas/IdentityNone"
        - $ref: "#/components/schemas/IdentityLocal"
        - $ref: "#/components/schemas/IdentityAd"
        - $ref: "#/components/schemas/IdentityEntra"
      discriminator:
        propertyName: mode
        mapping:
          none: "#/components/schemas/IdentityNone"
          local: "#/components/schemas/IdentityLocal"
          ad: "#/components/schemas/IdentityAd"
          entra: "#/components/schemas/IdentityEntra"

    IdentityNone:
      type: object
      required: [mode]
      description: No accounts are created; OOBE stays interactive for the end user.
      properties:
        mode: { type: string, enum: [none] }
        skipEula: { type: boolean, default: true }

    IdentityLocal:
      type: object
      required: [mode, accounts]
      properties:
        mode: { type: string, enum: [local] }
        accounts:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, group, passwordSecretId]
            properties:
              name: { type: string, maxLength: 20 }
              displayName: { type: string }
              group: { type: string, enum: [Administrators, Users] }
              passwordSecretId: { type: string, description: Secret of kind `password`. }
        autoLogon:
          type: object
          nullable: true
          properties:
            account: { type: string, description: "Must match one of `accounts[].name`." }
            count: { type: integer, minimum: 1, maximum: 10, default: 1 }
        hideOobe: { type: boolean, default: true }

    IdentityAd:
      type: object
      required: [mode, joinMethod]
      properties:
        mode: { type: string, enum: [ad] }
        joinMethod:
          type: string
          enum: [odj, credentials]
          description: |
            `odj` (recommended): offline domain join; each client needs an ODJ blob
            in `secretRefs.odjBlob` (from `djoin /provision`). No credentials reach
            the client. `credentials`: online join during specialize; needs
            line-of-sight to a DC and puts the join credential on the machine
            until cleanup.
        domain: { type: string, description: Required for `credentials`. }
        organizationalUnit: { type: string, nullable: true, description: "Distinguished name, e.g. OU=Labs,DC=corp,DC=example" }
        joinCredentialSecretId:
          type: string
          nullable: true
          description: Secret of kind `domain-credential`. Required for `credentials`.
        localAdmin:
          type: object
          nullable: true
          description: Optional break-glass local administrator.
          properties:
            name: { type: string, maxLength: 20 }
            passwordSecretId: { type: string }

    IdentityEntra:
      type: object
      required: [mode, method]
      properties:
        mode: { type: string, enum: [entra] }
        method:
          type: string
          enum: [autopilot-registered, autopilot-json, provisioning-package]
          description: |
            `autopilot-registered`: device already registered in Intune; nothing is
            injected, OOBE hands over to Autopilot once online.
            `autopilot-json`: agent writes the referenced AutopilotConfigurationFile.json
            into Windows/Provisioning/Autopilot of the applied image.
            `provisioning-package`: agent applies the referenced bulk-enrolment
            .ppkg offline with DISM.
        fileSecretId:
          type: string
          nullable: true
          description: Secret of kind `autopilot-json` or `provisioning-package`, matching `method`.

    OsSettings:
      type: object
      properties:
        computerNamePattern:
          type: string
          nullable: true
          description: |
            Template for the computer name, e.g. `LAB-{{ .Client.Serial | last 6 }}`.
            Rendered names must be 1-15 characters, letters/digits/hyphens, not all
            digits; violations fail the deployment at scheduling time. Null lets
            Windows generate a name.
        uiLanguage: { type: string, default: en-GB }
        systemLocale: { type: string, default: en-GB }
        userLocale: { type: string, default: en-GB }
        inputLocale: { type: string, default: "0809:00000809", description: "Keyboard layout, e.g. 0809:00000809 (UK)." }
        timeZone: { type: string, default: GMT Standard Time, description: Windows time zone ID. }
        productKeySecretId:
          type: string
          nullable: true
          description: Secret of kind `product-key`. Null uses the edition's default/KMS behaviour.

    # ---------- secrets
    SecretKind:
      type: string
      enum: [password, product-key, domain-credential, share-credential, odj-blob, autopilot-json, provisioning-package]
      description: |
        `share-credential`: a username and password for an SMB share (backup
        destination, SMB targets); the username is the secret's `hint`.

    SecretValue:
      type: object
      description: Exactly one of `value`, `credential` or `uploadId`, depending on kind.
      properties:
        value:
          type: string
          writeOnly: true
          description: For `password` and `product-key`.
        credential:
          type: object
          writeOnly: true
          description: For `domain-credential` and `share-credential`.
          required: [username, password]
          properties:
            username: { type: string, description: "e.g. CORP\\svc-join or svc-join@corp.example" }
            password: { type: string }
        uploadId:
          type: string
          description: For `odj-blob`, `autopilot-json` and `provisioning-package`.

    SecretInput:
      allOf:
        - type: object
          required: [name, kind]
          properties:
            name: { type: string }
            description: { type: string }
            kind: { $ref: "#/components/schemas/SecretKind" }
        - $ref: "#/components/schemas/SecretValue"

    Secret:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [name, kind, valueUpdatedAt]
          properties:
            name: { type: string }
            description: { type: string }
            kind: { $ref: "#/components/schemas/SecretKind" }
            valueUpdatedAt: { type: string, format: date-time }
            hint:
              type: string
              nullable: true
              description: Non-sensitive hint, e.g. the username of a domain credential or a file name.

    # ---------- clients
    ClientInput:
      type: object
      required: [mac]
      properties:
        mac: { $ref: "#/components/schemas/MacAddress" }
        smbiosUuid: { type: string, nullable: true, format: uuid }
        serial: { type: string, nullable: true }
        hostname: { type: string, nullable: true }
        profileId:
          type: string
          nullable: true
          description: Must be null until profiles exist (Phase 4).
        variables: { $ref: "#/components/schemas/Variables" }
        reservedIp:
          type: string
          nullable: true
          format: ipv4
          description: Fixed address on interfaces running `full` DHCP.
        secretRefs:
          type: object
          description: |
            Per-machine secrets, keyed by purpose. Currently `odjBlob` (used when the
            profile's identity is `ad` with `joinMethod: odj`).
          properties:
            odjBlob: { type: string, nullable: true, description: "Secret id of kind `odj-blob`. Must be null until secrets exist (Phase 5)." }

    Client:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - $ref: "#/components/schemas/ClientInput"
        - type: object
          properties:
            lastSeenAt: { type: string, nullable: true, format: date-time }
            lastIp: { type: string, nullable: true }
            lastArch: { nullable: true, type: string, allOf: [{ $ref: "#/components/schemas/ClientArch" }] }
            source: { readOnly: true, type: string, allOf: [{ $ref: "#/components/schemas/ClientSource" }] }

    ClientSource:
      type: string
      enum: [manual, discovered]
      description: |
        `manual`: created through the API. `discovered`: created automatically the
        first time the machine network-booted (DHCP) or checked in (agent). Both
        boot the same way; see ADR 0013.

    # ---------- deployments
    DeploymentStatus:
      type: string
      enum: [pending, running, succeeded, failed, cancelled]
      description: |
        `pending`: armed through the API; runs on the client's next network boot.
        `running`: the agent checked in (armed) or started it from the boot prompt.
        Only `pending` deployments are armed, so a machine that reboots mid-deployment
        or after it gets the boot prompt, not a re-image.

    DeploymentStage:
      type: string
      enum: [checked-in, partitioning, applying-image, injecting-drivers, configuring, finalizing, rebooting]

    Deployment:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [clientId, profileId, status]
          properties:
            clientId: { type: string }
            profileId: { type: string }
            origin:
              type: string
              enum: [scheduled, boot-prompt]
              readOnly: true
              description: "`scheduled`: armed through `POST /deployments`. `boot-prompt`: started at the machine."
            profileSnapshot: { $ref: "#/components/schemas/ProfileInput" }
            status: { $ref: "#/components/schemas/DeploymentStatus" }
            stage: { $ref: "#/components/schemas/DeploymentStage" }
            percent: { type: integer, minimum: 0, maximum: 100 }
            startedAt: { type: string, nullable: true, format: date-time }
            finishedAt: { type: string, nullable: true, format: date-time }
            message: { type: string }

    LogEntry:
      type: object
      required: [at, level, message]
      properties:
        at: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error] }
        message: { type: string, maxLength: 8192 }
        source: { type: string }

    # ---------- jobs
    # ---------- uploads
    Upload:
      type: object
      description: A tus upload (ADR 0017).
      required: [id, length, offset, status, imported, inUse, createdAt, updatedAt]
      properties:
        id: { type: string }
        filename: { type: string, nullable: true, description: From `Upload-Metadata`. }
        filetype: { type: string, nullable: true, description: From `Upload-Metadata`. }
        length: { type: integer, format: int64 }
        offset: { type: integer, format: int64, description: Bytes received. }
        status: { type: string, enum: [receiving, complete] }
        sha256: { type: string, nullable: true, description: Set once complete. }
        imported:
          type: boolean
          description: An import from this upload succeeded, so it is kept until deleted.
        inUse: { type: boolean, description: A queued or running import job is using it. }
        lastJobId: { type: string, nullable: true, description: The most recent import job that used it. }
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When it will be deleted. Null when kept until deleted (imported).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UploadPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Upload" } }
        nextCursor: { type: string, nullable: true }

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    JobKind:
      type: string
      enum: [image.import, driverPackage.import, bootImage.build, system.backup]

    Job:
      type: object
      description: |
        Background work (ADR 0016). Jobs queue and run in order: boot image builds
        one at a time, imports two at a time, backups one at a time on their own
        lane (ADR 0020). A job that was running when the
        server stopped fails with `interrupted`; it is not resumed.
      required: [id, kind, status, createdAt, percent, cancelRequested]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/JobKind" }
        status: { $ref: "#/components/schemas/JobStatus" }
        resourceId:
          type: string
          nullable: true
          description: |
            The image, driver package or boot image the job works on. An import that
            finds an identical existing item finishes with this set to that item.
        cancelRequested: { type: boolean, readOnly: true, description: "Cancel was requested while running; the job stops shortly." }
        percent: { type: integer, minimum: 0, maximum: 100 }
        message: { type: string }
        error:
          nullable: true
          type: object
          allOf: [{ $ref: "#/components/schemas/Problem" }]
          description: |
            Why the job failed. Codes include `insufficient_storage` (the content store
            ran short of space), `interrupted` (the server stopped while it ran),
            `unsupported_media` and `invalid_media` (image import),
            `unsupported_archive`, `invalid_archive` and `no_drivers` (driver import),
            and `internal_error`. For imports, `detail` also says until when the upload is
            kept for a retry.
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, nullable: true, format: date-time }
        finishedAt: { type: string, nullable: true, format: date-time }

    # ---------- smb
    SmbTargetInput:
      type: object
      required: [name, uncPath, localPath]
      properties:
        name: { type: string }
        uncPath: { type: string, description: 'As seen by clients, e.g. \\deploy01\images' }
        localPath: { type: string, description: Where this server writes the share's content. }
        credentialSecretId:
          type: string
          nullable: true
          description: Secret of kind `share-credential` clients use to connect (ADR 0021). Null for none.

    SmbTarget:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [name, uncPath, localPath]
          properties:
            name: { type: string }
            uncPath: { type: string }
            localPath: { type: string }
            credentialSecretId: { type: string, nullable: true }

    # ---------- settings
    BindFailure:
      type: object
      required: [interface, protocol, port, message]
      properties:
        interface: { type: string }
        protocol: { type: string, enum: [udp, tcp] }
        port: { type: integer }
        message: { type: string }
        ownerProcess:
          type: string
          nullable: true
          description: Process holding the port, when the OS can tell us (e.g. `svchost.exe (SharedAccess)`, `WDSServer`).

    ClientArch:
      type: string
      description: |
        Derived from DHCP option 93. `uefi-x64` = 7/9, `uefi-x64-http` = 16,
        `uefi-arm64` = 11, `uefi-arm64-http` = 19, `bios` = 0.
      enum: [bios, uefi-x64, uefi-x64-http, uefi-arm64, uefi-arm64-http]

    Settings:
      type: object
      required: [admin, interfaces]
      properties:
        etag: { type: string, readOnly: true }
        admin:
          type: object
          description: |
            Admin API + web UI listener. Always HTTPS; a self-signed certificate is
            generated on first run. Bind it to a management address so machines on
            the deployment network cannot reach the admin API.
          required: [bindAddress, port]
          properties:
            bindAddress: { type: string, description: "IP to listen on; `0.0.0.0` for all (not recommended).", default: 127.0.0.1 }
            port: { type: integer, default: 8443 }
            certificatePem: { type: string, nullable: true, description: Null keeps the generated certificate. }
            privateKeyPem: { type: string, nullable: true, writeOnly: true }
        interfaces:
          type: array
          description: Deployment-network interfaces. Each runs its own DHCP mode and content services.
          items: { $ref: "#/components/schemas/InterfaceSettings" }
        tftp:
          type: object
          description: |
            Server-side TFTP limits, applied to every client (firmware PXE, Boot
            Manager). Negotiated options are capped to these, which protects clients
            from a BCD that asks for more than the network can carry. Defaults are
            provisional until the physical I210 runs (Phase 1 tasks 7–8); see the
            Phase 1 findings, "Chosen defaults".
          properties:
            maxBlockSize:
              type: integer
              minimum: 512
              maximum: 65464
              default: 8192
              description: 16384 with a window of 16 lost IP fragments and failed to boot on Hyper-V; 8192/8 never lost a packet.
            maxWindowSize:
              type: integer
              minimum: 1
              maximum: 64
              default: 8
              description: Blocks sent before waiting for an ACK.
            timeoutSeconds:
              type: integer
              minimum: 1
              maximum: 60
              default: 1
              description: |
                Retransmit timeout when the client doesn't negotiate `timeout`. Boot
                Manager never ACKs early to request a resend, so each lost block costs a
                full timeout; a transfer is abandoned after 5 consecutive timeouts.
        contentHttps:
          type: object
          description: TLS for the content listener on interfaces with `services.https` enabled (Phase 6; stored but unused until then).
          properties:
            certificatePem: { type: string, nullable: true, description: Null generates a certificate from an internal CA (download via `/settings/content-ca`). }
            privateKeyPem: { type: string, nullable: true, writeOnly: true }
        bootPrompt:
          type: object
          description: |
            What a network-booted machine shows when no deployment is armed for it
            (ADR 0013). Every client that passes the architecture and interface MAC
            filters boots WinPE; DHCP does not answer a client until it has a
            profile to offer (its own, or `defaultProfileId`).
          properties:
            password:
              type: string
              nullable: true
              writeOnly: true
              minLength: 8
              description: Stored as an argon2id hash; never returned. Omit or null to keep the current password.
            hasPassword: { type: boolean, readOnly: true }
            requirePassword:
              type: boolean
              default: true
              description: |
                **Debug only.** False shows the profile menu without a password: anyone
                at a machine on a deployment network can re-image it. Raises the
                `boot_prompt_password_disabled` health warning, a UI banner, a startup
                log warning, and a banner on the WinPE screen.
            timeoutSeconds:
              type: integer
              minimum: 5
              maximum: 3600
              default: 30
              description: Prompt countdown; at zero the agent sets UEFI BootNext to the local disk and reboots.
            armedCountdownSeconds:
              type: integer
              minimum: 0
              maximum: 300
              default: 10
              description: Countdown before an armed deployment starts; any key opens the menu instead.
            defaultProfileId:
              type: string
              nullable: true
              description: |
                Preselected in the menu for clients without a profile, and the boot
                image source for them. Null: such clients are not answered.
        storage:
          type: object
          description: |
            Content store (ADR 0015). Its location is the `-content` startup flag
            (default `<data>/content`), not a setting.
          properties:
            reserveBytes:
              type: integer
              format: int64
              minimum: 0
              default: 5368709120
              description: |
                Free space the content store never uses (default 5 GiB). Uploads and
                imports that wouldn't leave this much free are refused with `507`;
                running jobs fail before going below it.
            uploadExpiryHours:
              type: integer
              minimum: 1
              maximum: 720
              default: 24
              description: |
                Uploads that were never imported, or whose last import failed, are
                deleted this long after their last activity. Uploads whose import
                succeeded are kept until deleted.
        backup: { $ref: "#/components/schemas/BackupSettings" }
        architectures:
          type: object
          description: Which client architectures are answered at all.
          properties:
            bios: { type: boolean, default: false, description: Windows 11 requires UEFI. }
            uefiX64: { type: boolean, default: true }
            uefiArm64: { type: boolean, default: true }
            httpBoot: { type: boolean, default: true, description: Answer UEFI HTTP Boot (HTTPClient) requests. }

    BackupSettings:
      type: object
      description: |
        Scheduled backups (ADR 0020): the database, admin certificate and the
        stored files they reference; incremental after the first run.
      properties:
        schedule:
          type: object
          description: |
            In the server's local time. A time skipped by a clock change runs at
            the next valid moment; a repeated one runs once. If the server was
            down at a scheduled time, one backup runs as soon as it starts.
          properties:
            frequency:
              type: string
              enum: [disabled, hourly, daily, weekly, monthly]
              default: disabled
            minute: { type: integer, minimum: 0, maximum: 59, default: 0, description: "`hourly`: minutes past the hour." }
            time:
              type: string
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
              default: "02:00"
              description: "`daily`, `weekly`, `monthly`: HH:MM, 24-hour."
            daysOfWeek:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
              default: [sun]
              description: "`weekly`."
            dayOfMonth:
              type: integer
              minimum: 1
              maximum: 31
              default: 1
              description: "`monthly`. Months shorter than this run on their last day, so 31 means the last day of every month."
        retention:
          type: integer
          minimum: 0
          maximum: 1000
          default: 5
          description: Snapshots to keep; older ones and the files only they reference are deleted after each successful backup. 0 keeps all.
        destination:
          type: object
          nullable: true
          description: Where backups go. Null disables backups (including `POST /system/backups`).
          required: [type, path]
          properties:
            type: { type: string, enum: [local, smb] }
            path:
              type: string
              description: |
                `local`: an absolute directory path on this server, not inside the data
                or content directories. `smb`: `\\server\share` with an optional
                subdirectory, e.g. `\\nas01\backups\netdeploy`.
            credentialSecretId:
              type: string
              nullable: true
              description: "`smb` only (required there): a secret of kind `share-credential` (ADR 0021)."

    InterfaceSettings:
      type: object
      required: [name, dhcp, services]
      properties:
        name: { type: string, description: 'OS interface name, e.g. `Ethernet 2` or `enp3s0`.' }
        macPrefixes:
          type: array
          description: |
            Optional allow-list. When non-empty, only clients whose MAC starts with one
            of these prefixes (e.g. an OUI, `00:1b:21`) are answered on this
            interface. Empty answers every PXE client. Applies to DHCP `proxy` and
            `full`; with `off` the external DHCP server decides.
          items:
            type: string
            pattern: "^[0-9a-f]{2}(:[0-9a-f]{2}){0,5}$"
        advertisedAddress:
          type: string
          nullable: true
          format: ipv4
          description: |
            Address clients use to reach this server (matters with several NICs or
            NAT). Null uses the interface's primary IPv4 address. Boot image
            `serverUrls` default from this.
        services:
          type: object
          properties:
            tftp: { type: boolean, default: true }
            http: { type: boolean, default: true }
            httpPort: { type: integer, default: 80 }
            https:
              type: boolean
              default: false
              description: Content over HTTPS. Planned for Phase 6; `true` is refused with `422` until then.
            httpsPort: { type: integer, default: 443 }
        dhcp:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: ["off", proxy, full]
              default: proxy
              description: |
                `off`: no DHCP; see `externalDhcpGuidance` for what to configure on
                your own server. `proxy`: answers PXE/HTTP boot clients only, never
                assigns addresses. `full`: address pool with persisted leases.
            listenOn67:
              type: boolean
              default: true
              description: |
                `proxy` only. Set false when a real DHCP server on this same host owns
                UDP 67; the proxy then uses 4011 only, so clients only find it if that
                server sends option 60 `PXEClient`. On Linux, don't share 67 with
                another DHCP server even if the bind succeeds: `SO_REUSEPORT` would
                split packets between the two at random.
            pool:
              type: object
              nullable: true
              description: Required for `full`.
              required: [start, end, subnetMask]
              properties:
                start: { type: string, format: ipv4 }
                end: { type: string, format: ipv4 }
                subnetMask: { type: string, format: ipv4 }
                router: { type: string, nullable: true, format: ipv4 }
                dnsServers: { type: array, items: { type: string, format: ipv4 } }
                domainName: { type: string, nullable: true }
                leaseSeconds: { type: integer, minimum: 60, default: 3600 }
                pingCheck: { type: boolean, default: true, description: Ping an address before offering it. }
        externalDhcpGuidance:
          type: array
          readOnly: true
          description: For `off` mode, the options to set on an external DHCP server, per architecture.
          items:
            type: object
            properties:
              arch: { $ref: "#/components/schemas/ClientArch" }
              nextServer: { type: string, description: Option 66 / siaddr. }
              bootFile: { type: string, description: Option 67 (a URL for HTTP boot). }
              vendorClass: { type: string, description: "Option 60 value to return (PXEClient or HTTPClient)." }

    DhcpLease:
      type: object
      required: [mac, ip, interface, expiresAt]
      properties:
        mac: { $ref: "#/components/schemas/MacAddress" }
        ip: { type: string, format: ipv4 }
        interface: { type: string }
        hostname: { type: string, nullable: true }
        arch: { nullable: true, type: string, allOf: [{ $ref: "#/components/schemas/ClientArch" }] }
        clientId: { type: string, nullable: true, description: 'Matching client, if any.' }
        reserved: { type: boolean, description: "The lease's address is its client's `reservedIp`." }
        expiresAt: { type: string, format: date-time }

    # ---------- tokens
    ApiToken:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, nullable: true, format: date-time }
        lastUsedAt: { type: string, nullable: true, format: date-time }

    # ---------- agent
    AgentIdentity:
      type: object
      required: [macs]
      properties:
        macs: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MacAddress" } }
        smbiosUuid: { type: string, nullable: true }
        serial: { type: string, nullable: true }
        manufacturer: { type: string, nullable: true }
        model: { type: string, nullable: true }
        agentVersion: { type: string }

    AgentToken:
      type: object
      required: [token, deploymentId, expiresAt]
      properties:
        token: { type: string, description: "`agentAuth` bearer token for this deployment." }
        deploymentId: { type: string }
        expiresAt: { type: string, format: date-time }

    AgentCheckInResult:
      type: object
      required: [state, clientId]
      properties:
        state: { type: string, enum: [armed, locked] }
        clientId: { type: string }
        armed:
          type: object
          nullable: true
          description: Present when `state` is `armed`.
          allOf:
            - $ref: "#/components/schemas/AgentToken"
            - type: object
              required: [profileName, countdownSeconds]
              properties:
                profileName: { type: string }
                countdownSeconds: { type: integer }
        prompt:
          type: object
          nullable: true
          description: Present when `state` is `locked`.
          required: [requirePassword, passwordConfigured, timeoutSeconds]
          properties:
            requirePassword: { type: boolean, description: False in debug mode; show the warning banner. }
            passwordConfigured: { type: boolean, description: False means only armed deployments can run; say so on screen. }
            timeoutSeconds: { type: integer }

    AgentUnlockResult:
      type: object
      required: [sessionToken, expiresAt, profiles]
      properties:
        sessionToken: { type: string, description: "`agentSessionAuth` bearer token; single use." }
        expiresAt: { type: string, format: date-time }
        defaultProfileId:
          type: string
          nullable: true
          description: Preselected entry; the client's profile, else `Settings.bootPrompt.defaultProfileId`.
        profiles:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }

    AgentDeploymentPlan:
      type: object
      required: [deploymentId, installMethod, image, editionIndex]
      properties:
        deploymentId: { type: string }
        installMethod: { $ref: "#/components/schemas/InstallMethod" }
        image:
          type: object
          required: [contentUrl, sha256]
          properties:
            contentUrl: { type: string, description: HTTP(S) URL of install.wim/esd (agent mode). }
            sha256: { type: string }
            sizeBytes: { type: integer }
        editionIndex: { type: integer }
        unattendUrl:
          type: string
          nullable: true
          description: |
            Rendered with real secret values; only fetchable with this deployment's
            agent token, and only until the deployment finishes.
        unattendDestination:
          type: string
          enum: [panther, setup-argument]
          description: |
            `panther`: agent writes it to `Windows/Panther/unattend.xml` of the applied
            image (agent mode). `setup-argument`: passed to setup.exe via `/unattend` (smb mode).
        identityFiles:
          type: array
          description: Files the agent places or applies after the image is applied.
          items:
            type: object
            required: [kind, contentUrl, sha256]
            properties:
              kind: { type: string, enum: [odj-blob, autopilot-json, provisioning-package] }
              contentUrl: { type: string }
              sha256: { type: string }
        cleanup:
          type: object
          description: Agent installs a SetupComplete step that removes these after setup.
          properties:
            removeUnattend: { type: boolean, default: true }
        osDrivers:
          type: array
          items:
            type: object
            properties:
              contentUrl: { type: string }
              sha256: { type: string }
        smb:
          type: object
          nullable: true
          description: Present when `installMethod` is `smb`.
          properties:
            uncPath: { type: string }
            username: { type: string, nullable: true }
            password: { type: string, nullable: true }
            setupPath: { type: string, description: Path to setup.exe relative to the share. }
        disk:
          type: object
          properties:
            layout: { type: string, enum: [uefi-gpt-default], default: uefi-gpt-default }
            targetDiskIndex: { type: integer, default: 0 }

    AgentProgress:
      type: object
      required: [stage]
      properties:
        stage: { $ref: "#/components/schemas/DeploymentStage" }
        percent: { type: integer, minimum: 0, maximum: 100 }
        message: { type: string, maxLength: 1024 }
