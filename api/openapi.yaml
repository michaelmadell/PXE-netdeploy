      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogEntryPage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- jobs
  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: List jobs.
      description: |
        Oldest first. Finished jobs are kept for 30 days (ADR 0016).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: status, in: query, schema: { $ref: "#/components/schemas/JobStatus" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/JobKind" } }
        - { name: resourceId, in: query, schema: { type: string }, description: "Jobs for one image, driver package or boot image." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /jobs/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get details of a specific job.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /jobs/{jobId}/cancel:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a specific job.
      description: |
        A queued job is cancelled at once. A running job gets `cancelRequested`
        and stops at its next checkpoint, then becomes `cancelled`. A finished job
        is returned unchanged.
      responses:
        "200":
          description: Cancellation requested (or job already finished).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

